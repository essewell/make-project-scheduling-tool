<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<style>
/*
 * ============================================================
 * UI POLISH PASS — Audit Item Changes (client-ready pass)
 *
 * #1  TOPBAR OVERFLOW — stats moved to .stat-bar (32px strip);
 *     .app grid updated to auto auto auto 1fr.
 * #2  TASK LIST COLUMN WIDTHS — 1fr 52px 80px 48px.
 * #3  STATUS BADGE — opacity:0 by default, reveals on hover/selected.
 * #4  GROUP ROW HOVER — var(--color-surface-2); dark override removed.
 * #5  WIZARD — 32px wordmark, 0.4em tracking, dot-pattern overlay,
 *     3px accent top border, tagline, fade+slide entrance.
 * #6  EMPTY STATE — Gantt sketch SVG with today-line indicator.
 * #7  GANTT BAR — left/width/filter transitions for smooth zoom.
 * #8  FILTER BAR — overflow-x:auto, flex-wrap:nowrap, search shrink:0.
 * #9  PANEL LABELS — monospace, 9px, uppercase, 0.08em tracking.
 * #10 GANTT ZOOM PILL — bottom-anchored; z-index:10.
 * ============================================================
 */

/*
 * ============================================================
 * Fentiman Schedule — Design System v2
 * UI-only pass. JavaScript, event handlers, state, and
 * localStorage untouched.
 *
 * TYPOGRAPHY
 *   Primary ........... Plus Jakarta Sans (400/500/600)
 *     Geometric grotesque — distinctive but legible at 10–14px.
 *     Replaces Poppins, which was generic and slightly loose.
 *   Monospace ......... Space Mono (400/700)
 *     Creates a clear data tier for dates, stats, percentages.
 *     All numeric/date content uses --font-mono automatically.
 *   Scale ............. 9.5 / 11 / 12 / 13 / 16 / 19 px
 *     Four primary sizes; 9.5 only for true micro-labels.
 *   Casing ............ All text-transform:uppercase removed.
 *     Hierarchy via size + weight + color — not shouting.
 *
 * COLOR SYSTEM
 *   All values as CSS custom properties. Zero hardcoded hex
 *   in layout/component CSS rules. (Status inset shadows are
 *   intentional exceptions: those colors are data-system values.)
 *   Single accent: --accent (#27AAE1) — interactive states only.
 *   Brand navy: --brand (#1c3048) — topbar and primary text.
 *   No gradients. Removed decorative shadow on .bar.
 *   Dark mode: @media prefers-color-scheme:dark remaps all vars.
 *   All foreground/background pairings meet WCAG AA contrast.
 *
 * SPACING
 *   8px base grid. --space-1 (4px) through --space-10 (40px).
 *   All padding/margin/gap on components uses scale references.
 *
 * COMPONENTS
 *   Two button variants: .primary-btn (accent fill, h=28px)
 *   and .ghost-btn (outlined, h=28px). Consistent :focus-visible
 *   ring on all interactive elements.
 *   Inputs: uniform 30px height, 5px radius, 3px accent ring.
 *
 * LEGACY ALIASES
 *   All original variable names (--navy, --ink-4, --make-blue,
 *   --bg, --surface, etc.) aliased to canonical new vars.
 *   --ink-4 is specifically required by tool-panel.jsx.
 *   --bar-color is an element-scoped custom property set by the
 *   Bar component inline style; consumed in .bar{background}.
 * ============================================================
 */

/* ── Tokens ──────────────────────────────────────────────────── */
:root {
  /* Fonts */
  --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Space Mono", ui-monospace, Menlo, "Courier New", monospace;

  /* Type scale — min readable = 11px (UI Polish Pass v3) */
  --text-2xs:  11px;
  --text-xs:   12px;
  --text-sm:   13px;
  --text-base: 14px;
  --text-md:   16px;
  --text-lg:   19px;

  /* Spacing — 8px grid */
  --space-1:   4px;
  --space-2:   8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;

  /* Brand */
  --brand:        #1c3048;
  --accent:       #27aae1;
  --accent-hover: #1a96cc;
  --accent-dim:   rgba(39, 170, 225, 0.11);

  /* Surfaces */
  --color-bg:        #eff2f6;
  --color-surface:   #ffffff;
  --color-surface-2: #f5f8fb;

  /* Borders */
  --color-border:        #dce3ea;
  --color-border-strong: #c1cbda;
  --color-border-faint:  #ecf0f5;

  /* Text */
  --color-text-primary:   #1c3048;
  --color-text-secondary: #466070;
  --color-text-tertiary:  #7894a6;
  --color-text-dim:       #a6bcca;

  /* Functional */
  --color-danger:       #bf3b2e;
  --color-danger-dim:   rgba(191, 59, 46, 0.07);
  --color-today:        #27aae1;
  --color-weekend:      rgba(0, 0, 0, 0.022);
  --color-selected-bg:  #e2f2fb;

  /* Radii */
  --radius-sm: 3px;
  --radius:    5px;
  --radius-lg: 10px;

  /* Shadows — only functional depth retained */
  --shadow-panel: 0 16px 48px rgba(15, 28, 50, 0.11), 0 1px 0 rgba(15, 28, 50, 0.05);

  /* ── Polish pass v3 — semantic tokens ─────────────────────────── */
  --color-toast-bg:          #1c2d3f;           /* UndoToast background         */
  --color-success:           #1D9E75;           /* ahead-variance / completion  */
  --color-text-inverse:      #ffffff;           /* text on dark/filled surfaces */
  --color-brand-hover:       #14253a;           /* brand navy :hover            */
  --color-danger-hatch:      rgba(191,59,46,0.35);  /* holiday stripe fill     */
  --color-danger-hatch-bd:   rgba(191,59,46,0.30);  /* holiday stripe border   */

    /* ── Legacy aliases — required for JSX backward compat ── */
  --ink:          var(--color-text-primary);
  --ink-2:        var(--color-text-secondary);
  --ink-3:        var(--color-text-tertiary);
  --ink-4:        var(--color-text-dim);    /* used in tool-panel.jsx inline style */
  --navy:         var(--brand);
  --make-blue:    var(--accent);
  --today:        var(--color-today);
  --danger:       var(--color-danger);
  --bg:           var(--color-bg);
  --bg-app:       var(--color-bg);
  --surface:      var(--color-surface);
  --bg-surface:   var(--color-surface);
  --surface-2:    var(--color-surface-2);
  --bg-soft:      var(--color-surface-2);
  --bg-band:      var(--color-surface-2);
  --bg-strong:    var(--color-surface-2);
  --border:       var(--color-border);
  --line:         var(--color-border);
  --border-md:    var(--color-border-strong);
  --line-strong:  var(--color-border-strong);
  --border-lt:    var(--color-border-faint);
  --line-faint:   var(--color-border-faint);
  --weekend:      var(--color-weekend);
  --shadow-bar:   0 0 0 transparent;  /* removed decorative bar shadow */
}

/* ── Dark mode ───────────────────────────────────────────────── */
@media (prefers-color-scheme: dark) {
  :root {
    --brand:         #0e1c2c;
    --accent-hover:  #38b9ed;

    --color-bg:        #111d29;
    --color-surface:   #192a3c;
    --color-surface-2: #1f3245;

    --color-border:        #25364a;
    --color-border-strong: #324759;
    --color-border-faint:  #1b2c3e;

    --color-text-primary:   #d8eaf4;
    --color-text-secondary: #7da4b9;
    --color-text-tertiary:  #4f7589;
    --color-text-dim:       #344f61;

    --color-danger:       #e05548;
    --color-danger-dim:   rgba(224, 85, 72, 0.10);
    --color-weekend:      rgba(255, 255, 255, 0.018);
    --color-selected-bg:  rgba(39, 170, 225, 0.12);

    --shadow-panel: 0 16px 48px rgba(0, 0, 0, 0.36), 0 1px 0 rgba(255, 255, 255, 0.04);
    --color-toast-bg:  #091421;
    --color-success:   #25c28e;
  }
}

/* ── Reset ───────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: 400;
  color: var(--color-text-primary);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  letter-spacing: -0.01em;
}
.mono {
  font-family: var(--font-mono);
  font-feature-settings: "tnum";
  font-size: 0.92em;
  letter-spacing: 0;
}
input, select, textarea, button { font: inherit; color: inherit; }

/* ── Form elements ───────────────────────────────────────────── */
input[type=text],
input[type=date],
select {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 0 var(--space-2);
  height: 30px;
  outline: none;
  transition: border-color 0.12s, box-shadow 0.12s;
  color: var(--color-text-primary);
}
textarea {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-2);
  outline: none;
  resize: vertical;
  transition: border-color 0.12s, box-shadow 0.12s;
  color: var(--color-text-primary);
}
input[type=text]:focus,
input[type=date]:focus,
select:focus,
textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
button {
  cursor: pointer;
  background: none;
  border: none;
}
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius);
}

/* ── App shell ───────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-rows: auto auto auto 1fr; /* #1 — topbar / stat-bar / filter-bar / main */
  height: 100vh;
  background: var(--color-bg);
  overflow: hidden;
  min-width: 0;
}
.main {
  display: grid;
  grid-template-columns: 490px 1fr auto;
  overflow: hidden;
  background: var(--color-bg);
  min-width: 0;
}

/* ── Topbar ──────────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  padding: 0 var(--space-5);
  height: 52px;
  background: var(--brand);
  gap: var(--space-5);
  flex-shrink: 0;
}

.make-wordmark {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: #fff;
  flex-shrink: 0;
  line-height: 1;
  padding-right: 0.05em;
}

.brand-divider {
  width: 1px;
  height: 24px;
  background: rgba(255, 255, 255, 0.13);
  flex-shrink: 0;
}

.brand { display: flex; align-items: center; gap: var(--space-3); }
.brand-text { line-height: 1.25; }

.brand-title {
  font-size: var(--text-sm);
  font-weight: 500;
  color: rgba(255, 255, 255, 0.90);
  letter-spacing: 0;
}
.brand-sub {
  font-size: var(--text-2xs);
  color: rgba(255, 255, 255, 0.32);
  font-weight: 400;
  letter-spacing: 0.04em;
  margin-top: 2px;
}

.editable-title { cursor: pointer; display: flex; align-items: center; gap: var(--space-1); }
.editable-title:hover { color: #fff; }
.editable-title:hover .edit-hint { opacity: 1; }
.edit-hint { opacity: 0; font-size: 9px; color: rgba(255, 255, 255, 0.28); transition: opacity 0.15s; }

.brand-title-input {
  font-size: var(--text-sm) !important;
  font-weight: 500 !important;
  color: #fff !important;
  border: 1px solid rgba(255, 255, 255, 0.22) !important;
  border-radius: var(--radius-sm) !important;
  padding: 2px var(--space-2) !important;
  height: auto !important;
  background: rgba(255, 255, 255, 0.08) !important;
  outline: none !important;
  width: 180px !important;
  box-shadow: none !important;
}

/* Topbar stats */
.topbar-stats { display: flex; gap: var(--space-5); align-items: center; }

.stat .stat-k {
  font-size: var(--text-2xs);
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.30);
  margin-bottom: 2px;
  font-weight: 500;
}
.stat .stat-v {
  font-size: var(--text-xs);
  color: rgba(255, 255, 255, 0.80);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: 400;
}
.progress-bar-row { display: flex; align-items: center; gap: var(--space-2); }
.mini-progress {
  width: 68px;
  height: 4px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 99px;
  overflow: hidden;
}
.mini-progress > div { height: 100%; background: var(--accent); transition: width 0.3s; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-1); }
.topbar-sep { width: 1px; height: 16px; background: rgba(255, 255, 255, 0.11); margin: 0 var(--space-1); }

/* ── Stat bar (#1 — slim secondary strip below topbar) ───────── */
.stat-bar {
  display: flex;
  align-items: center;
  gap: var(--space-5);
  height: 32px;
  padding: 0 var(--space-5);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
  overflow: hidden;
}
.stat-bar .stat {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--space-2);
}
.stat-bar .stat-k {
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  letter-spacing: 0.07em;
  color: var(--color-text-dim);
  font-weight: 500;
  margin-bottom: 0;
  text-transform: uppercase;
}
.stat-bar .stat-v {
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: 400;
}
.stat-bar .mini-progress { background: var(--color-border-strong); height: 4px; }
.stat-bar .stat + .stat::before {
  content: '';
  display: block;
  width: 1px;
  height: 12px;
  background: var(--color-border);
  margin-right: var(--space-3);
}

/* ── Buttons ─────────────────────────────────────────────────── */

/*
 * v3 GHOST BUTTON SYSTEM — three explicit variants:
 *   .ghost-btn              → GhostOnDark   — topbar (dark bg)
 *   .ghost-btn-light        → Ghost         — light surfaces (modal, wizard, panel)
 *   .ghost-btn-destructive  → GhostDestructive — critical path toggle + danger
 */

/* GhostOnDark — topbar */
.ghost-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 0 var(--space-2);
  height: 28px;
  border-radius: var(--radius);
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: transparent;
  color: rgba(255, 255, 255, 0.62);
  font-size: var(--text-xs);
  font-weight: 500;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  white-space: nowrap;
  letter-spacing: 0;
}
.ghost-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.24);
  color: #fff;
}
.ghost-btn.small { padding: 0 var(--space-2); }

/* Ghost — light surfaces (modals, wizard, panel, empty state)
 * v3: also available as explicit .ghost-btn-light class */
.ghost-btn-light {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 0 var(--space-2);
  height: 28px;
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-secondary);
  font-size: var(--text-xs);
  font-weight: 500;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  white-space: nowrap;
  cursor: pointer;
}
.ghost-btn-light:hover {
  background: var(--color-surface-2);
  border-color: var(--color-border-strong);
  color: var(--color-text-primary);
}

/* GhostDestructive — critical path toggle + danger actions */
.ghost-btn-destructive {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 0 var(--space-2);
  height: 28px;
  border-radius: var(--radius);
  border: 1px solid rgba(224, 85, 72, 0.30);
  background: var(--color-danger-dim);
  color: var(--color-danger);
  font-size: var(--text-xs);
  font-weight: 500;
  transition: background 0.12s, border-color 0.12s;
  white-space: nowrap;
  cursor: pointer;
}
.ghost-btn-destructive:hover {
  background: rgba(224, 85, 72, 0.14);
  border-color: rgba(224, 85, 72, 0.50);
}

/* Context aliases — forward to Ghost (light) semantics */
.wizard-box .ghost-btn,
.modal-foot .ghost-btn,
.panel-foot .ghost-btn,
.empty-actions .ghost-btn {
  border-color: var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-secondary);
}
.wizard-box .ghost-btn:hover,
.modal-foot .ghost-btn:hover,
.panel-foot .ghost-btn:hover,
.empty-actions .ghost-btn:hover {
  background: var(--color-surface-2);
  border-color: var(--color-border-strong);
  color: var(--color-text-primary);
}

/* Ghost — active state (critical path toggle) */
.ghost-btn.ghost-btn-active {
  background: rgba(224, 85, 72, 0.11);
  border-color: rgba(224, 85, 72, 0.38);
  color: var(--color-danger);
}
.ghost-btn.ghost-btn-active:hover {
  background: rgba(224, 85, 72, 0.18);
  color: var(--color-danger);
}

/* Primary button */
.primary-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 0 var(--space-3);
  height: 28px;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--color-text-inverse);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.01em;
  border: none;
  transition: background 0.12s;
  white-space: nowrap;
}
.primary-btn:hover { background: var(--accent-hover); }
.primary-btn:disabled { opacity: 0.38; cursor: not-allowed; }

/* Primary — brand navy on white surfaces */
.wizard-box .primary-btn,
.empty-actions .primary-btn {
  background: var(--brand);
}
.wizard-box .primary-btn:hover,
.empty-actions .primary-btn:hover { background: var(--color-brand-hover); }

/* Zoom tabs — dark (topbar) */
.zoom-tabs {
  display: inline-flex;
  padding: 2px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: var(--radius);
  gap: 1px;
}
.zoom-tabs button {
  padding: 3px var(--space-2);
  font-size: var(--text-xs);
  font-weight: 500;
  color: rgba(255, 255, 255, 0.40);
  border-radius: var(--radius-sm);
  transition: background 0.10s, color 0.10s;
}
.zoom-tabs button.active {
  background: rgba(255, 255, 255, 0.13);
  color: #fff;
}

/* Zoom tabs — light (modal/csv context) */
.modal-body .zoom-tabs {
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
}
.modal-body .zoom-tabs button { color: var(--color-text-tertiary); }
.modal-body .zoom-tabs button.active {
  background: var(--color-surface);
  color: var(--color-text-primary);
}

/* ── Filter bar ──────────────────────────────────────────────── */
/* #8 — horizontal scroll instead of wrap on overflow */
.filter-bar {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
  color: var(--color-text-dim);
  flex-shrink: 0; /* #8 — stay visible when filter-bar overflows */
}
.search-wrap svg { position: absolute; left: var(--space-2); pointer-events: none; }
.search-wrap input { padding-left: 26px; width: 168px; height: 28px; }

.filter-group { display: flex; align-items: center; gap: var(--space-1); flex-wrap: wrap; }

.filter-label {
  font-size: var(--text-2xs);
  color: var(--color-text-dim);
  font-weight: 500;
  margin-right: var(--space-1);
  letter-spacing: 0.03em;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 3px var(--space-2);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--color-text-tertiary);
  font-size: var(--text-xs);
  font-weight: 500;
  white-space: nowrap;
  transition: background 0.10s, color 0.10s;
}
.chip:hover { background: var(--color-surface-2); color: var(--color-text-secondary); }
.chip.active { background: var(--brand); color: #fff; }
.chip-dot { width: 6px; height: 6px; border-radius: 99px; flex-shrink: 0; }

.filter-count { margin-left: auto; font-size: var(--text-xs); color: var(--color-text-dim); }
.filter-count strong { color: var(--color-text-secondary); font-weight: 500; }

/* ── Task list ───────────────────────────────────────────────── */
.task-list {
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  overflow-y: auto;
  overflow-x: hidden;
}
/* #2 — widened Party col to 52px, Dates to 80px, Float to 48px */
.task-list-head {
  position: sticky;
  top: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr 52px 80px 48px;
  background: var(--color-surface-2);
  border-bottom: 1px solid var(--color-border);
  font-size: var(--text-2xs);
  letter-spacing: 0.04em;
  color: var(--color-text-dim);
  font-weight: 500;
  height: 64px;
  align-items: end;
  padding: 0 var(--space-4) 11px;
  gap: var(--space-2);
}
.task-list-body { padding-bottom: 200px; }

.row {
  display: grid;
  grid-template-columns: 1fr 52px 80px 48px; /* #2 — matches task-list-head */
  align-items: center;
  padding: 0 var(--space-4);
  gap: var(--space-2);
  border-bottom: 1px solid var(--color-border-faint);
  cursor: pointer;
  transition: background 0.08s;
}
.row.task-row:hover { background: var(--color-surface-2); }
/* ── Keyboard focus ring on task rows ───────────────────────────── */
/*
 * v4 FOCUS RING REFINEMENT
 * focus-only  = accent ring, NO background fill (avoids clashing with blue selected)
 * selected    = filled --color-selected-bg, no ring
 * focus+selected (both) = filled bg + accent ring combined gracefully
 * MAGIC NUMBER: outline-offset -2px keeps ring inside the 1px border-bottom row separator.
 * Flagged for Claude Code: consider focus-visible polyfill for pointer users.
 */
.row.task-row.kb-focused {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  /* No background — focus ring only. Selected state owns the fill. */
}
.row.task-row.kb-focused.selected {
  background: var(--color-selected-bg);
  /* Combined: filled bg (selected) + accent ring (focused). Graceful merge. */
}

.row.task-row.selected { background: var(--color-selected-bg); }

.tr-name { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.tr-name-bar { width: 3px; height: 14px; border-radius: 2px; flex-shrink: 0; }
.tr-name-text {
  font-size: var(--text-sm);
  color: var(--color-text-primary);
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ms-glyph { color: var(--color-text-tertiary); margin-right: 3px; font-size: 9px; }

.note-badge {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: var(--text-2xs);
  color: var(--color-text-dim);
  padding: 1px var(--space-1);
  border-radius: var(--radius-sm);
  background: var(--color-surface-2);
  flex-shrink: 0;
}
.tr-party { display: flex; align-items: center; }
.tr-status { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
.status-dot { width: 6px; height: 6px; border-radius: 99px; flex-shrink: 0; }
.status-text { font-size: var(--text-xs); color: var(--color-text-tertiary); white-space: nowrap; }

.tr-dates {
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.5;
  color: var(--color-text-secondary);
  letter-spacing: 0;
}
.tr-dates .dim { color: var(--color-text-dim); }

.muted { color: var(--color-text-dim); font-size: var(--text-base); }

.party-badge-sm {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 var(--space-1);
  height: 18px;
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: var(--text-2xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* Group rows */
.row.group-row {
  background: var(--color-surface-2);
  border-bottom: 1px solid var(--color-border);
  border-top: 1px solid var(--color-border);
  font-size: var(--text-xs);
  font-weight: 500;
  letter-spacing: 0.01em;
  grid-template-columns: 14px 1fr 30px;
  padding: 0 var(--space-3);
}
/* v3: visible hover — subtle tint + left accent border */
.row.group-row:hover {
  background: var(--color-bg);
  box-shadow: inset 3px 0 0 var(--accent);
}

.group-caret { font-size: var(--text-xs); color: var(--color-text-dim); }
.group-name  { font-size: var(--text-xs); }
.group-count {
  font-size: var(--text-2xs);
  color: var(--color-text-dim);
  font-weight: 500;
  text-align: right;
  font-family: var(--font-mono);
  letter-spacing: 0;
}

/* ── Gantt ───────────────────────────────────────────────────── */
.gantt-area {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.gantt-scroll {
  overflow: auto;
  position: relative;
  background: var(--color-surface);
  flex: 1;
  min-height: 0;
}
.gantt-pane { position: relative; }

.gantt-header-sticky {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--color-surface-2);
  border-bottom: 1px solid var(--color-border);
  height: 64px;
}
.gantt-header { position: relative; height: 64px; }
.gantt-header-row { position: relative; }
.gantt-header-primary { height: 28px; border-bottom: 1px solid var(--color-border-faint); }
.gantt-header-secondary { height: 36px; }

.gantt-header-cell {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-text-primary);
  border-right: 1px solid var(--color-border-faint);
  gap: var(--space-1);
}
.gantt-header-cell.sub {
  font-size: var(--text-2xs);
  font-weight: 500;
  color: var(--color-text-dim);
  letter-spacing: 0.04em;
}
.gantt-header-cell .m { font-weight: 600; color: var(--color-text-primary); }
.gantt-header-cell .y { color: var(--color-text-dim); font-weight: 400; font-size: var(--text-2xs); }

.gantt-header-day {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--color-text-dim);
  border-right: 1px solid var(--color-border-faint);
  letter-spacing: 0;
}
.gantt-header-day.weekend { background: var(--color-weekend); }

.gantt-body { position: relative; }
.gantt-grid { position: absolute; inset: 0; pointer-events: none; }

.grid-band-weekend { position: absolute; top: 0; background: var(--color-weekend); }
.grid-line { position: absolute; top: 0; width: 1px; }
.grid-line-month { background: var(--color-border); }
.grid-line-week  { background: var(--color-border-faint); }

.grid-group-band {
  position: absolute;
  left: 0;
  background: var(--color-surface-2);
  border-bottom: 1px solid var(--color-border);
  border-top: 1px solid var(--color-border);
}

.today-line {
  position: absolute;
  top: 0;
  width: 2px;
  background: var(--accent);
  z-index: 4;
  pointer-events: none;
}
.today-flag {
  position: absolute;
  top: -20px;
  left: 3px;
  background: var(--accent);
  color: #fff;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 2px var(--space-2);
  border-radius: var(--radius-sm);
  white-space: nowrap;
}

/* Zoom pill */
/* #10 — bottom-anchored; no longer overlaps sticky header */
.gantt-zoom-pill {
  position: absolute;
  right: var(--space-4);
  bottom: var(--space-4);
  top: auto;
  transform: none;
  display: inline-flex;
  align-items: center;
  gap: 1px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 99px;
  padding: 2px 3px;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(15, 28, 50, 0.08);
}
.gzc-btn {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 500;
  color: var(--color-text-tertiary);
  transition: background 0.10s, color 0.10s;
}
.gzc-btn:hover { background: var(--color-surface-2); color: var(--color-text-primary); }
.gzc-reset {
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  font-weight: 700;
  color: var(--color-text-tertiary);
  padding: 0 var(--space-2);
  height: 22px;
  border-radius: 99px;
  min-width: 48px;
  transition: background 0.10s, color 0.10s;
  white-space: nowrap;
  letter-spacing: 0;
}
.gzc-reset:hover { background: var(--color-surface-2); color: var(--color-text-primary); }

/* ── Bars ────────────────────────────────────────────────────── */
/* #7 — smooth zoom transitions */
.bar {
  position: absolute;
  height: 20px;
  border-radius: var(--radius);
  background: var(--bar-color);
  display: flex;
  align-items: center;
  transition: left 0.12s ease, width 0.12s ease, filter 0.10s;
  user-select: none;
  z-index: 2;
}
.bar:hover { filter: brightness(1.08); }
.bar.selected { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 3; }

.bar-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  background: rgba(255, 255, 255, 0.20);
  border-radius: var(--radius) 0 0 var(--radius);
  pointer-events: none;
}
.bar-body {
  flex: 1;
  height: 100%;
  cursor: grab;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.bar-body:active { cursor: grabbing; }

.bar-label {
  position: relative;
  padding: 0 var(--space-2);
  font-size: var(--text-xs);
  font-weight: 500;
  color: rgba(255, 255, 255, 0.95);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  z-index: 1;
  letter-spacing: 0;
}
.bar-pct { color: rgba(255, 255, 255, 0.52); font-size: 9.5px; }

.bar-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 5px;
  cursor: ew-resize;
  z-index: 2;
}
.bar-handle-left  { left: 0;  border-radius: var(--radius) 0 0 var(--radius); }
.bar-handle-right { right: 0; border-radius: 0 var(--radius) var(--radius) 0; }
.bar-handle:hover { background: rgba(0, 0, 0, 0.12); }

.bar.status-not_started { opacity: 0.50; }
.bar.status-at_risk     { box-shadow: 0 0 0 1.5px #EF9F27 inset; }
.bar.status-delayed     { box-shadow: 0 0 0 1.5px #E24B4A inset; }
.bar.status-complete    { opacity: 0.62; }
.bar.status-complete .bar-fill { background: rgba(255, 255, 255, 0.34); width: 100% !important; }

.milestone {
  position: absolute;
  transform: rotate(45deg);
  border-radius: 2px;
  border: 2px solid var(--color-surface);
  cursor: pointer;
  z-index: 2;
}
.milestone.selected { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Critical path */
.bar.cp-critical { box-shadow: none; outline: 2.5px solid #E24B4A; outline-offset: 1px; z-index: 3; filter: brightness(1.05); }
.bar.cp-dimmed   { opacity: 0.24; }
.milestone.cp-critical { box-shadow: 0 0 0 3px var(--color-danger); }
.milestone.cp-dimmed   { opacity: 0.24; }

/* ── Side panel ──────────────────────────────────────────────── */
.side-panel {
  width: 360px;
  background: var(--color-surface);
  border-left: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  overflow: hidden; /* constrain flex children so panel-body can scroll */
  box-shadow: var(--shadow-panel);
  animation: schedule-slide-in 0.18s ease-out;
}
@keyframes schedule-slide-in {
  from { transform: translateX(12px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}

.panel-head {
  padding: var(--space-4) var(--space-4) var(--space-3);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}
.panel-head-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.group-tag {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px var(--space-2);
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  font-weight: 500;
}
.group-tag .dot { width: 5px; height: 5px; border-radius: 99px; }

.icon-btn {
  width: 28px;
  height: 28px;
  border-radius: var(--radius);
  display: grid;
  place-items: center;
  font-size: 18px;
  color: var(--color-text-dim);
  transition: background 0.12s, color 0.12s;
}
.icon-btn:hover { background: var(--color-surface-2); color: var(--color-text-secondary); }

.panel-title {
  margin-top: var(--space-2);
  margin-left: -8px;
  width: calc(100% + 8px);
  font-size: var(--text-md);
  font-weight: 500;
  border: 1px solid transparent;
  background: transparent;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius);
  letter-spacing: -0.015em;
  line-height: 1.35;
  color: var(--color-text-primary);
  height: auto;
  min-height: 36px;
}
.panel-title:hover { background: var(--color-surface-2); }
.panel-title:focus {
  background: var(--color-surface-2);
  border-color: var(--color-border);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.panel-body { flex: 1; overflow-y: auto; padding: var(--space-4); min-height: 0; }

.panel-row { margin-bottom: var(--space-4); }
/* #9 — monospace micro-labels commit to data-tier visual language */
.panel-row label {
  display: block;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-dim);
  font-weight: 400;
  margin-bottom: var(--space-1);
}
.panel-row input[type=text],
.panel-row input[type=date],
.panel-row select,
.panel-row textarea { width: 100%; }

.panel-row.split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }

.progress-row { display: flex; align-items: center; gap: var(--space-3); }
.progress-row input[type=range] { flex: 1; accent-color: var(--accent); }
.progress-row .mono { font-size: var(--text-sm); font-weight: 500; min-width: 36px; text-align: right; }

.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.meta-grid > div {
  background: var(--color-surface-2);
  border: 1px solid var(--color-border-faint);
  padding: var(--space-2) var(--space-2);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
}
.meta-k {
  font-size: var(--text-2xs);
  letter-spacing: 0.04em;
  color: var(--color-text-dim);
}
.meta-v { font-size: var(--text-base); font-weight: 500; margin-top: 2px; color: var(--color-text-primary); }

.party-select-row { display: flex; align-items: center; gap: var(--space-2); }
.party-select-row select { flex: 1; }
.party-badge {
  border-radius: var(--radius-sm);
  color: #fff;
  font-weight: 700;
  display: grid;
  place-items: center;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.checkbox-label {
  display: flex !important;
  align-items: center;
  gap: var(--space-2);
  cursor: pointer;
  font-size: var(--text-base) !important;
  text-transform: none !important;
  letter-spacing: 0 !important;
  color: var(--color-text-secondary) !important;
}
.checkbox-label input { width: auto; accent-color: var(--accent); }

.panel-section {
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
}
.panel-section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-2xs);
  letter-spacing: 0.04em;
  color: var(--color-text-dim);
  font-weight: 600;
  margin-bottom: var(--space-3);
}
.panel-section-title .count {
  background: var(--color-surface-2);
  color: var(--color-text-tertiary);
  padding: 1px var(--space-1);
  border-radius: var(--radius-sm);
  font-size: var(--text-2xs);
}

/* Notes */
.note-list { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-3); }

.note-empty {
  font-size: var(--text-sm);
  color: var(--color-text-dim);
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface-2);
  border-radius: var(--radius);
  border: 1px solid var(--color-border-faint);
  line-height: 1.55;
}
.note-item {
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface-2);
  border: 1px solid var(--color-border-faint);
  border-radius: var(--radius);
}
.note-text { font-size: var(--text-sm); color: var(--color-text-secondary); line-height: 1.55; }
.note-when { font-size: var(--text-2xs); color: var(--color-text-dim); margin-top: var(--space-1); }

.note-compose { display: flex; flex-direction: column; gap: var(--space-2); }
.note-compose textarea { font-size: var(--text-sm); width: 100%; min-height: 52px; }
.note-compose .btn-primary {
  align-self: flex-end;
  display: inline-flex;
  align-items: center;
  padding: 0 var(--space-3);
  height: 28px;
  background: var(--brand);
  color: #fff;
  border-radius: var(--radius);
  font-size: var(--text-sm);
  font-weight: 600;
  transition: background 0.12s;
}
.note-compose .btn-primary:hover { background: var(--color-brand-hover); }
.note-compose .btn-primary:disabled { opacity: 0.38; cursor: not-allowed; }

/* Panel footer */
.panel-foot {
  border-top: 1px solid var(--color-border);
  padding: var(--space-3) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.btn-danger {
  display: inline-flex;
  align-items: center;
  font-size: var(--text-xs);
  color: var(--color-danger);
  padding: 0 var(--space-2);
  height: 28px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  transition: background 0.12s, border-color 0.12s;
}
.btn-danger:hover {
  background: var(--color-danger-dim);
  border-color: rgba(191, 59, 46, 0.18);
}
.foot-hint { font-size: var(--text-xs); color: var(--color-text-dim); }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px var(--space-2);
  border-radius: 99px;
  border: 1px solid;
  font-size: var(--text-xs);
  font-weight: 500;
}

/* Dependencies */
.dep-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  max-height: 220px;
  overflow-y: auto;
  padding-right: 2px;
}
.dep-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius);
  border: 1px solid var(--color-border-faint);
  background: var(--color-surface-2);
  cursor: pointer;
  font-size: var(--text-sm);
  color: var(--color-text-secondary);
  transition: border-color 0.10s, background 0.10s;
  user-select: none;
}
.dep-item:hover { border-color: var(--color-border); }
.dep-item-checked {
  background: var(--color-selected-bg);
  border-color: rgba(39, 170, 225, 0.28);
  color: var(--color-text-primary);
}
.dep-item input[type=checkbox] { flex-shrink: 0; accent-color: var(--accent); }
.dep-swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.dep-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dep-date {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--color-text-dim);
  white-space: nowrap;
  flex-shrink: 0;
  letter-spacing: 0;
}

/* ── Modals ──────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 18, 30, 0.54);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(3px);
}
.modal-box {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  width: 460px;
  max-width: 95vw;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 64px rgba(10, 18, 30, 0.22), 0 1px 0 rgba(255, 255, 255, 0.06);
  animation: schedule-slide-in 0.16s ease-out;
}
.modal-head {
  padding: var(--space-4) var(--space-5) var(--space-3);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-head h3 {
  font-size: var(--text-base);
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--color-text-primary);
}
.modal-hint {
  font-size: var(--text-sm);
  color: var(--color-text-tertiary);
  line-height: 1.6;
  margin-bottom: var(--space-4);
}
.modal-body { flex: 1; overflow-y: auto; padding: var(--space-4) var(--space-5); }
.modal-foot {
  padding: var(--space-3) var(--space-5);
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Party/phase list */
.party-list { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-6); }
.party-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius);
  border: 1px solid var(--color-border-faint);
  background: var(--color-surface-2);
  transition: border-color 0.10s;
}
.party-item:hover { border-color: var(--color-border); }

.party-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.party-item-name { flex: 1; font-size: var(--text-base); font-weight: 500; cursor: pointer; }
.party-item-name:hover { color: var(--brand); text-decoration: underline; text-decoration-style: dotted; }
.party-item-abbr {
  font-size: var(--text-xs);
  color: var(--color-text-dim);
  font-family: var(--font-mono);
  background: var(--color-surface);
  border: 1px solid var(--color-border-faint);
  padding: 1px var(--space-1);
  border-radius: var(--radius-sm);

  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-dim);
  margin-bottom: var(--space-1);
}
.circular-dep-error {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--color-danger-dim);
  border: 1px solid rgba(191,59,46,0.24);
  border-radius: var(--radius);
  font-size: var(--text-sm);
  color: var(--color-danger);
  line-height: 1.5;
  margin-bottom: var(--space-3);
}

/* ── Workweek modal ───────────────────────────────────────────── */
.workweek-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--space-2);
  margin-bottom: var(--space-5);
}
.ww-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-2) var(--space-1);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  cursor: pointer;
  transition: background 0.10s, border-color 0.10s;
  user-select: none;
}
.ww-day:hover { background: var(--color-surface-2); }
.ww-day.active {
  background: var(--accent-dim);
  border-color: rgba(39,170,225,0.38);
}
.ww-day-name {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-secondary);
  letter-spacing: 0.02em;
}
.ww-day.active .ww-day-name { color: var(--accent); }
.ww-check {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--color-border-strong);
  display: grid;
  place-items: center;
  font-size: 9px;
  color: transparent;
  transition: background 0.10s, border-color 0.10s;
}
.ww-day.active .ww-check {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.holiday-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  max-height: 140px;
  overflow-y: auto;
  margin-bottom: var(--space-3);
}
.holiday-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius);
  background: var(--color-surface-2);
  border: 1px solid var(--color-border-faint);
  font-size: var(--text-sm);
}
.holiday-item-date {
  font-family: var(--font-mono);
  font-size: 11px;
  flex: 1;
  color: var(--color-text-secondary);
  letter-spacing: 0;
}
.holiday-hatch {
  width: 14px; height: 14px;
  border-radius: 2px;
  background: repeating-linear-gradient(
    45deg,
    var(--color-danger-hatch) 0, var(--color-danger-hatch) 2px,
    transparent 2px, transparent 5px
  );
  border: 1px solid var(--color-danger-hatch-bd);
  flex-shrink: 0;
}
.add-holiday-row {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}

/* ── Print layout ─────────────────────────────────────────────── */
.print-trigger-group {
  position: relative;
}
.schedule-print-loading {
  position: fixed;
  inset: 0;
  background: rgba(10,18,30,0.54);
  z-index: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.schedule-print-loading__box {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: var(--space-8) var(--space-10);
  text-align: center;
  box-shadow: 0 24px 64px rgba(10,18,30,0.22);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
}
.print-spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--color-border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: schedule-spin 0.7s linear infinite;
}
@keyframes schedule-spin { to { transform: rotate(360deg); } }
.schedule-print-loading__msg {
  font-size: var(--text-sm);
  color: var(--color-text-secondary);
}

/* ── Print layout — 2-column A3 landscape ─────────────────────────── */
@media print {
  @page { size: A3 landscape; margin: 12mm 16mm; }

  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  body { background: #fff !important; overflow: visible !important; }

  /* Hide interactive chrome */
  .topbar, .stat-bar, .filter-bar, .gantt-zoom-pill,
  .side-panel, .side-panel-backdrop, .mobile-tab-bar,
  .undo-toast, .schedule-print-loading,
  .empty-state-wrap, .today-line, .today-flag,
  .dep-svg, .bar-ghost, .variance-arrow,
  .bar-handle, .gantt-zoom-pill { display: none !important; }

  /* Grid lines hidden — bars only */
  .grid-line, .grid-band-weekend { display: none !important; }
  .gantt-header-sticky { display: none !important; }

  /* App shell — single block flow */
  .app {
    display: block !important;
    height: auto !important;
    overflow: visible !important;
  }

  /* 2-column grid */
  .main {
    display: grid !important;
    grid-template-columns: 220px 1fr !important;
    overflow: visible !important;
    height: auto !important;
    background: #fff !important;
    gap: 0 !important;
  }

  /* Left: task list */
  .task-list {
    overflow: visible !important;
    height: auto !important;
    border-right: 1.5px solid #c1cbda !important;
    font-size: 11px !important;
  }
  .task-list-head {
    position: static !important;
    z-index: auto !important;
    height: auto !important;
    align-items: center !important;
    padding: 6px var(--space-4) !important;
  }
  /* Keep group header with its first child */
  .row.group-row { break-after: avoid; page-break-after: avoid; }
  .row.task-row  { break-inside: avoid; page-break-inside: avoid; }

  /* Right: Gantt — bars only, scaled to fit */
  .gantt-area {
    display: flex !important;
    flex-direction: column !important;
    overflow: visible !important;
  }
  .gantt-scroll {
    overflow: visible !important;
    height: auto !important;
    flex: 1 !important;
  }
  .gantt-pane, .gantt-body { position: relative !important; overflow: visible !important; }

  /* Scale long timelines to fit — tune zoom (0.4–0.7) per project length */
  .gantt-scroll > .gantt-pane { zoom: 0.55; transform-origin: top left; }

  /* Bar colour fidelity */
  .bar { position: absolute !important; }
  .bar-label { color: rgba(255,255,255,0.95) !important; }
  .bar-fill  { background: rgba(255,255,255,0.20) !important; }
}

/* ── Bottom sheet (mobile panel) ──────────────────────────────── */
.bottom-sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10,18,30,0.36);
  z-index: 58;
  backdrop-filter: blur(2px);
}
@keyframes schedule-sheet-up {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.bottom-sheet {
  animation: schedule-sheet-up 0.22s cubic-bezier(0.34,1.1,0.64,1);
}
.sheet-handle-bar {
  width: 36px; height: 3px; /* v4 spec: 3px grip bar */
  border-radius: 99px;
  background: var(--color-border-strong);
  margin: var(--space-2) auto var(--space-1);
  cursor: ns-resize;
  touch-action: none; /* prevent scroll-capture during drag */
  flex-shrink: 0;
}

/* ── Gantt touch states ───────────────────────────────────────── */
.bar-touch-active {
  filter: brightness(1.15) !important;
  box-shadow: 0 4px 16px rgba(0,0,0,0.22) !important;
  z-index: 10 !important;
}
.snap-ghost {
  position: absolute;
  border-radius: var(--radius);
  border: 2px dashed rgba(39,170,225,0.55);
  background: rgba(39,170,225,0.08);
  pointer-events: none;
  z-index: 9;
  transition: left 0.06s, width 0.06s;
}

/* ════════════════════════════════════════════════════════════════
 * v4 ADDITIONS — all new components below
 * ════════════════════════════════════════════════════════════════ */

/* ── N-key shortcut badge on "New task" button ─────────────────── */
.new-task-btn-wrap {
  position: relative;
  display: inline-flex;
}
.kbd-badge {
  position: absolute;
  top: -8px;
  right: -6px;
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: rgba(255,255,255,0.72);
  padding: 1px 4px;
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.15s ease, transform 0.15s ease;
  white-space: nowrap;
  line-height: 1.4;
  letter-spacing: 0.04em;
}
.new-task-btn-wrap:hover .kbd-badge { opacity: 1; transform: translateY(0); }

/* ── Gantt area pulse — onboarding first task ─────────────────── */
@keyframes schedule-gantt-pulse {
  0%   { box-shadow: inset 0 0 0 0   rgba(39,170,225,0.00); }
  40%  { box-shadow: inset 0 0 0 3px rgba(39,170,225,0.40); }
  100% { box-shadow: inset 0 0 0 0   rgba(39,170,225,0.00); }
}
.gantt-area.onboarding-pulse {
  animation: schedule-gantt-pulse 1.4s cubic-bezier(0.4,0,0.2,1) 2;
}

/* ── Baseline onboarding tooltip ───────────────────────────────── */
.baseline-menu-wrap { position: relative; }
.baseline-onboarding-tip {
  position: absolute;
  top: calc(100% + 12px);
  right: 0;
  width: 230px;
  background: var(--color-toast-bg);
  color: rgba(255,255,255,0.88);
  border-radius: var(--radius-lg);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-xs);
  line-height: 1.6;
  box-shadow: 0 8px 28px rgba(0,0,0,0.30);
  z-index: 200;
  animation: schedule-slide-in 0.22s ease-out;
  pointer-events: none; /* auto-dismisses; user clicks baseline btn naturally */
}
/* Caret pointer */
.baseline-onboarding-tip::before {
  content: '';
  position: absolute;
  top: -5px;
  right: 22px;
  width: 10px; height: 10px;
  background: var(--color-toast-bg);
  transform: rotate(45deg);
  border-radius: 2px;
}
.baseline-onboarding-tip strong {
  display: block;
  color: var(--accent);
  font-size: var(--text-xs);
  font-weight: 600;
  margin-bottom: var(--space-1);
}
.baseline-onboarding-tip .tip-dismiss {
  display: block;
  margin-top: var(--space-2);
  font-size: 10px;
  opacity: 0.50;
}

/* ── Ghost bar style variants ─────────────────────────────────── */
/*
 * Three alternatives to the default 45° stripe:
 *   .ghost-solid   — solid fill at 20% opacity (most subtle)
 *   .ghost-outline — dashed border only (cleanest at small sizes)
 *   .ghost-stripe  — original stripes + drop shadow (most visible)
 *
 * Default (.bar-ghost with no variant class) keeps stripe behaviour
 * for backward compat. Variants are toggled by App state → ghostStyle.
 *
 * MAGIC NUMBER: height 8px chosen to sit in the lower half of the
 * 36px row without overlapping the main bar (22px centred).
 */
.bar-ghost { position: absolute; border-radius: 99px; pointer-events: none; z-index: 1; height: 8px; }
/* (a) solid fill */
.bar-ghost.ghost-solid {
  background: currentColor;
  opacity: 0.20;
}
/* (b) dashed outline only */
.bar-ghost.ghost-outline {
  background: transparent;
  border: 1.5px dashed currentColor;
  opacity: 0.60;
  border-radius: 3px;
}
/* (c) diagonal stripes + subtle drop shadow [default] */
.bar-ghost.ghost-stripe {
  background: repeating-linear-gradient(
    45deg,
    currentColor 0,
    currentColor 2px,
    transparent 2px,
    transparent 6px
  );
  opacity: 0.38;
  /* MAGIC NUMBER: 4px blur/8px spread — enough visibility on any group colour */
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.22));
}

/* ── Variance label pill ──────────────────────────────────────── */
/*
 * v4: variance labels now carry a surface background pill so they
 * remain readable on any bar colour at 9.5px / 700 weight.
 * Previous spec used bare colour text — failed on light group colours.
 */
.variance-arrow {
  position: absolute;
  display: flex;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 9.5px; /* bumped from 9px — 1 step up for legibility */
  font-weight: 700;
  letter-spacing: 0;
  pointer-events: none;
  z-index: 4;
  background: var(--color-surface);
  border: 1px solid;
  border-radius: 3px;
  padding: 1px 4px;
  line-height: 1.4;
  /* MAGIC NUMBER: 1px border gives outline legibility on both light/dark */
}
.variance-arrow.slip  { color: var(--color-danger);  border-color: rgba(191,59,46,0.28); }
.variance-arrow.ahead { color: var(--color-success);  border-color: rgba(29,158,117,0.28); }

/* Dark mode variance pill */
@media (prefers-color-scheme: dark) {
  .variance-arrow.slip  { border-color: rgba(224,85,72,0.30); }
  .variance-arrow.ahead { border-color: rgba(37,194,142,0.30); }
}

/* ── Ghost style toggle pill (Gantt area) ─────────────────────── */
.ghost-style-toggle {
  position: absolute;
  right: var(--space-4);
  bottom: calc(var(--space-4) + 44px); /* 44px above zoom pill — no overlap */
  display: flex;
  gap: 1px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 99px;
  padding: 2px 3px;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(15,28,50,0.08);
  opacity: 0;
  transform: translateY(6px);
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.ghost-style-toggle.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.gst-btn {
  height: 22px;
  padding: 0 var(--space-2);
  border-radius: 99px;
  font-size: 10px;
  font-weight: 500;
  color: var(--color-text-tertiary);
  white-space: nowrap;
  transition: background 0.10s, color 0.10s;
  letter-spacing: 0;
}
.gst-btn.gst-active {
  background: var(--color-surface-2);
  color: var(--color-text-primary);
}
.gst-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.06em;
  color: var(--color-text-dim);
  display: flex;
  align-items: center;
  padding: 0 var(--space-2) 0 var(--space-1);
  text-transform: uppercase;
}

/* ── Print preview modal ──────────────────────────────────────── */
.print-preview-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,18,30,0.72);
  z-index: 800;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
  animation: schedule-fade-in 0.18s ease-out;
}
@keyframes schedule-fade-in { from { opacity: 0; } to { opacity: 1; } }

.print-preview-chrome {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  width: 92vw;
  max-width: 1140px;
  height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 40px 80px rgba(0,0,0,0.40);
  overflow: hidden;
  animation: schedule-slide-in 0.18s ease-out;
}
.print-preview-head {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-5);
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}
.print-preview-head h3 { font-size: var(--text-sm); font-weight: 600; color: var(--color-text-primary); }
.print-preview-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px var(--space-2);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  background: var(--color-surface-2);
  color: var(--color-text-tertiary);
  border: 1px solid var(--color-border);
  letter-spacing: 0;
}
.print-preview-body {
  flex: 1;
  overflow: auto;
  background: #8f9aaa; /* paper tray grey */
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 32px;
  gap: 24px;
}
/* A3 landscape at 96dpi: 420mm × 297mm ≈ 1587 × 1122px
 * displayed at 0.55 scale → ~873 × 617px on screen
 * MAGIC NUMBER: 0.55 is the spec zoom; tune per project length */
.print-page-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.print-page-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: rgba(255,255,255,0.60);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.print-page {
  background: #fff;
  box-shadow: 0 6px 24px rgba(0,0,0,0.28), 0 1px 0 rgba(0,0,0,0.10);
  width: 1587px;
  min-height: 1122px;
  transform-origin: top left;
  /* Scale applied inline via style prop */
  flex-shrink: 0;
  overflow: hidden;
  font-family: "Plus Jakarta Sans", ui-sans-serif, sans-serif;
  color: #1c3048;
  position: relative;
}
.print-page-header {
  height: 36px;
  background: #1c3048;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
}
.print-page-header-title {
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,0.90);
  letter-spacing: 0.01em;
}
.print-page-header-date {
  font-size: 10px;
  color: rgba(255,255,255,0.42);
  font-family: "Space Mono", monospace;
  letter-spacing: 0;
}
.print-body-cols {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: calc(1122px - 36px);
  overflow: hidden;
}
.print-body-cols.summary-mode { grid-template-columns: 1fr; }

/* Print task list column */
.print-tl {
  border-right: 1.5px solid #c1cbda;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.print-tl-head {
  background: #f5f8fb;
  border-bottom: 1px solid #dce3ea;
  padding: 6px 10px;
  display: grid;
  grid-template-columns: 1fr 52px 72px;
  font-size: 8px;
  font-weight: 600;
  color: #7894a6;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  flex-shrink: 0;
}
.print-tl-body { overflow: hidden; }
.print-tl-group {
  background: #f5f8fb;
  border-bottom: 1px solid #dce3ea;
  border-top: 1px solid #dce3ea;
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.print-tl-group-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.print-tl-group-name {
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.print-tl-row {
  display: grid;
  grid-template-columns: 1fr 52px 72px;
  padding: 3px 10px;
  border-bottom: 1px solid #ecf0f5;
  align-items: center;
  min-height: 20px;
}
.print-tl-name-cell { display: flex; align-items: center; gap: 4px; overflow: hidden; }
.print-tl-bar  { width: 2px; height: 11px; border-radius: 1px; flex-shrink: 0; }
.print-tl-name { font-size: 9px; color: #1c3048; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.print-tl-dates { font-family: "Space Mono", monospace; font-size: 7.5px; color: #7894a6; line-height: 1.6; }
.print-tl-status {
  font-size: 7px;
  font-weight: 600;
  text-align: right;
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Print Gantt column */
.print-gantt-col {
  overflow: hidden;
  position: relative;
  background: #fff;
  display: flex;
  flex-direction: column;
}
.print-gantt-header {
  height: 28px;
  background: #f5f8fb;
  border-bottom: 1px solid #dce3ea;
  position: relative;
  flex-shrink: 0;
}
.print-gantt-header-cell {
  position: absolute;
  top: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  font-weight: 600;
  color: #466070;
  border-right: 1px solid #dce3ea;
  white-space: nowrap;
  overflow: hidden;
}
.print-gantt-body {
  position: relative;
  flex: 1;
  overflow: hidden;
}
.print-gantt-bar {
  position: absolute;
  height: 14px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  overflow: hidden;
}
.print-gantt-bar-fill { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(255,255,255,0.22); }
.print-gantt-bar-label {
  position: relative;
  padding: 0 5px;
  font-size: 8px;
  font-weight: 500;
  color: rgba(255,255,255,0.92);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}
.print-today-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 1.5px;
  background: #27aae1;
  z-index: 4;
  pointer-events: none;
}

/* Summary table mode */
.print-summary-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 10px;
}
.print-summary-table th {
  background: #f5f8fb;
  padding: 6px 10px;
  text-align: left;
  font-weight: 600;
  font-size: 8px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #7894a6;
  border-bottom: 1px solid #dce3ea;
  border-right: 1px solid #ecf0f5;
  white-space: nowrap;
}
.print-summary-table td {
  padding: 4px 10px;
  border-bottom: 1px solid #ecf0f5;
  border-right: 1px solid #ecf0f5;
  font-size: 9px;
  color: #1c3048;
  white-space: nowrap;
