<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
// Schedule Tool — shared data, helpers, CSV utilities

// ── Numeric constants ─────────────────────────────────────────────────────────
const MS_PER_DAY     = 86_400_000; // milliseconds in one calendar day
const WORKDAY_RATIO  = 5 / 7;      // approximate working-days-per-calendar-day

const EXAMPLE_TASKS = [
  { name: "Project Kickoff",             s: "2026-06-01", e: "2026-06-05",  group: "Planning"    },
  { name: "Requirements Gathering",      s: "2026-06-08", e: "2026-06-30",  group: "Planning"    },
  { name: "Risk Assessment",             s: "2026-06-15", e: "2026-06-26",  group: "Planning"    },
  { name: "Concept Design",              s: "2026-07-01", e: "2026-07-31",  group: "Design"      },
  { name: "Design Review",               s: "2026-08-03", e: "2026-08-14",  group: "Design"      },
  { name: "Detailed Design",             s: "2026-08-17", e: "2026-09-30",  group: "Design"      },
  { name: "Vendor Selection",            s: "2026-09-01", e: "2026-09-30",  group: "Procurement" },
  { name: "Material & Equipment Orders", s: "2026-10-01", e: "2026-10-31",  group: "Procurement" },
  { name: "Site Preparation",            s: "2026-11-02", e: "2026-11-27",  group: "Execution"   },
  { name: "Phase 1 — Foundation",        s: "2026-11-30", e: "2027-02-26",  group: "Execution"   },
  { name: "Phase 2 — Structure",         s: "2027-03-01", e: "2027-05-30",  group: "Execution"   },
  { name: "Phase 3 — Fitout",            s: "2027-06-01", e: "2027-08-29",  group: "Execution"   },
  { name: "Systems Integration",         s: "2027-09-01", e: "2027-10-17",  group: "Execution"   },
  { name: "Quality Assurance",           s: "2027-10-20", e: "2027-11-14",  group: "Testing"     },
  { name: "User Acceptance Testing",     s: "2027-11-17", e: "2027-12-12",  group: "Testing"     },
  { name: "Deficiency Remediation",      s: "2027-12-15", e: "2028-01-16",  group: "Testing"     },
  { name: "Final Inspection",            s: "2028-01-19", e: "2028-02-02",  group: "Closeout"    },
  { name: "Handover & Training",         s: "2028-02-03", e: "2028-02-28",  group: "Closeout"    },
  { name: "Project Close",               s: "2028-03-01", e: "2028-03-15",  group: "Closeout"    },
];

const DEFAULT_GROUPS = [
  { id: "g-planning",    name: "Planning",    color: "#378ADD" },
  { id: "g-design",      name: "Design",      color: "#7F77DD" },
  { id: "g-procurement", name: "Procurement", color: "#EF9F27" },
  { id: "g-execution",   name: "Execution",   color: "#1D9E75" },
  { id: "g-testing",     name: "Testing",     color: "#D85A30" },
  { id: "g-closeout",    name: "Closeout",    color: "#B07012" },
];

const GROUP_COLORS_PALETTE = [
  "#378ADD", "#7F77DD", "#EF9F27", "#1D9E75", "#D85A30", "#B07012",
  "#E24B4A", "#185FA5", "#5E9120", "#C24E78", "#7C7B73", "#3AACB8",
];

const DEFAULT_PARTIES = [
  { id: "party-pm", name: "Project Manager",    abbr: "PM", color: "#D85A30" },
  { id: "party-dt", name: "Design Team",        abbr: "DT", color: "#7F77DD" },
  { id: "party-gc", name: "General Contractor", abbr: "GC", color: "#1D9E75" },
  { id: "party-cl", name: "Client / Owner",     abbr: "OW", color: "#185FA5" },
  { id: "party-ve", name: "Vendor / Supplier",  abbr: "VS", color: "#EF9F27" },
  { id: "party-qa", name: "QA / Testing",       abbr: "QA", color: "#E24B4A" },
];

const PARTY_COLORS = [
  "#D85A30", "#7F77DD", "#1D9E75", "#378ADD", "#EF9F27",
  "#E24B4A", "#185FA5", "#5E9120", "#C24E78", "#B07012", "#7C7B73", "#3AACB8",
];

const STATUSES = [
  { id: "not_started", label: "Not started", color: "#9C9A92", swatch: "#E8E5DC" },
  { id: "in_progress", label: "In progress", color: "#1D9E75", swatch: "#D7EFE3" },
  { id: "at_risk",     label: "At risk",     color: "#EF9F27", swatch: "#FBE8C7" },
  { id: "delayed",     label: "Delayed",     color: "#E24B4A", swatch: "#F8D7D6" },
  { id: "complete",    label: "Complete",    color: "#185FA5", swatch: "#D6E2EF" },
];

// ── Progress helpers ──────────────────────────────────────────────────────────

function computeAutoProgress(startStr, endStr, today) {
  const start   = toD(startStr);
  const end     = toD(endStr);
  const total   = end - start;
  const elapsed = Math.max(0, Math.min(total, today - start));
  const naturalPct = total > 0 ? Math.round((elapsed / total) * 100) : 0;

  if (today < start) return { status: "not_started", pct: 0   };
  if (today >= end)  return { status: "complete",    pct: 100 };
  return               { status: "in_progress",  pct: naturalPct };
}

function enrichTask(task, index, today) {
  const { status, pct } = computeAutoProgress(task.s, task.e, today);
  return {
    ...task,
    id:           "t" + index,
    party:        null,
    status,
    pct,
    notes:        "",
    milestone:    false,
    manualStatus: false,
    manualPct:    false,
    deps:         task.deps || [],
  };
}

function refreshAutoProgress(tasks, today) {
  return tasks.map(task => {
    const { status, pct } = computeAutoProgress(task.s, task.e, today);
    return {
      ...task,
      status: task.manualStatus ? task.status : status,
      pct:    task.manualPct    ? task.pct    : pct,
    };
  });
}

// ── Date helpers ──────────────────────────────────────────────────────────────

/** Parse a "YYYY-MM-DD" string into a local-midnight Date, avoiding UTC-shift issues. */
function toD(dateStr) {
  const [y, m, d] = String(dateStr).split("-").map(Number);
  return new Date(y, m - 1, d);
}

function fmtDate(d) {
  if (typeof d === "string") return d;
  const y  = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, "0");
  const dy = String(d.getDate()).padStart(2, "0");
  return `${y}-${mo}-${dy}`;
}

function prettyDate(s) {
  const d = typeof s === "string" ? toD(s) : s;
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function shortDate(s) {
  const d = typeof s === "string" ? toD(s) : s;
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function addDays(d, n) {
  const result = new Date(d);
  result.setDate(result.getDate() + n);
  return result;
}

function daysBetween(a, b) {
  return Math.round((toD(b) - toD(a)) / MS_PER_DAY);
}

function durationDays(task) {
  return daysBetween(task.s, task.e) + 1;
}

function workdays(task) {
  return Math.round(durationDays(task) * WORKDAY_RATIO);
}

function nowLabel() {
  const now = new Date();
  return (
    now.toLocaleDateString("en-US", { month: "short", day: "numeric" }) +
    " at " +
    now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })
  );
}

// ── Critical Path Method (CPM) ────────────────────────────────────────────────

function computeCriticalPath(tasks) {
  if (!tasks || tasks.length < 2) {
    return { criticalIds: new Set(), floatMap: {}, hasDeps: false };
  }

  const taskById = {};
  tasks.forEach(t => { taskById[t.id] = t; });

  // successors[id] = list of task ids that depend on id
  const successors = {};
  tasks.forEach(t => { successors[t.id] = []; });
  tasks.forEach(t => {
    (t.deps || []).forEach(predId => {
      if (taskById[predId]) successors[predId].push(t.id);
    });
  });

  const hasDeps = tasks.some(t => (t.deps || []).some(d => taskById[d]));
  if (!hasDeps) return { criticalIds: new Set(), floatMap: {}, hasDeps: false };

  // Kahn's topological sort — handles cycles gracefully by appending unseen nodes.
  const inDegree = {};
  tasks.forEach(t => {
    inDegree[t.id] = (t.deps || []).filter(d => taskById[d]).length;
  });
  const queue      = tasks.filter(t => inDegree[t.id] === 0).map(t => t.id);
  const topoOrder  = [];
  const visited    = new Set();

  while (queue.length) {
    const id = queue.shift();
    if (visited.has(id)) continue;
    visited.add(id);
    topoOrder.push(id);
    successors[id].forEach(succId => {
      if (--inDegree[succId] <= 0 && !visited.has(succId)) queue.push(succId);
    });
  }
  // Append any nodes caught in a dependency cycle so they aren't silently dropped.
  tasks.forEach(t => { if (!visited.has(t.id)) topoOrder.push(t.id); });

  // Calendar-day durations
  const duration = {};
  tasks.forEach(t => { duration[t.id] = daysBetween(t.s, t.e) + 1; });

  // Forward pass — Early Start / Early Finish
  const earlyStart  = {};
  const earlyFinish = {};
  topoOrder.forEach(id => {
    const resolvedPreds = (taskById[id].deps || []).filter(d => taskById[d] && earlyFinish[d] !== undefined);
    earlyStart[id]  = resolvedPreds.length ? Math.max(...resolvedPreds.map(p => earlyFinish[p] + 1)) : 0;
    earlyFinish[id] = earlyStart[id] + duration[id] - 1;
  });

  const projectEnd = Math.max(...tasks.map(t => earlyFinish[t.id] || 0));

  // Backward pass — Late Start / Late Finish
  const lateFinish = {};
  const lateStart  = {};
  [...topoOrder].reverse().forEach(id => {
    const resolvedSuccs = successors[id].filter(s => lateStart[s] !== undefined);
    lateFinish[id] = resolvedSuccs.length ? Math.min(...resolvedSuccs.map(s => lateStart[s] - 1)) : projectEnd;
    lateStart[id]  = lateFinish[id] - duration[id] + 1;
  });

  // Total float — zero float means the task is on the critical path.
  const floatMap    = {};
  const criticalIds = new Set();
  tasks.forEach(t => {
    floatMap[t.id] = lateStart[t.id] !== undefined ? lateStart[t.id] - earlyStart[t.id] : Infinity;
    if (floatMap[t.id] <= 0) criticalIds.add(t.id);
  });

  return { criticalIds, floatMap, hasDeps: true };
}

// ── CSV helpers ───────────────────────────────────────────────────────────────

function parseCSVText(text) {
  if (!text || !text.trim()) return { headers: [], rows: [] };

  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");

  function parseLine(line) {
    const fields = [];
    let inQuotes = false;
    let current  = "";
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (ch === "," && !inQuotes) {
        fields.push(current);
        current = "";
      } else {
        current += ch;
      }
    }
    fields.push(current);
    return fields.map(f => f.trim());
  }

  const headers = parseLine(lines[0]);
  const rows    = [];

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const fields = parseLine(lines[i]);
    const row    = {};
    headers.forEach((h, j) => { row[h] = fields[j] || ""; });
    rows.push(row);
  }

  return { headers, rows };
}

function generateCSV(tasks, groups, parties) {
  const escape = value => {
    if (value === null || value === undefined) return "";
    const str = String(value);
    if (str.includes(",") || str.includes('"') || str.includes("\n")) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  };

  const header = ["Task Name","Phase","Start Date","End Date","Status","Progress (%)","Responsible Party","Milestone","Notes"];
  const lines  = [header.join(",")];

  tasks.forEach(task => {
    const party = parties.find(p => p.id === task.party);
    lines.push([
      escape(task.name),
      escape(task.group),
      escape(task.s),
      escape(task.e),
      escape(task.status),
      escape(task.pct),
      escape(party ? party.name : ""),
      escape(task.milestone ? "Yes" : "No"),
      escape(task.notes || ""),
    ].join(","));
  });

  return lines.join("\n");
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime || "text/plain" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

window.SCHEDULE = {
  EXAMPLE_TASKS, DEFAULT_GROUPS, GROUP_COLORS_PALETTE, STATUSES,
  DEFAULT_PARTIES, PARTY_COLORS,
  toD, fmtDate, prettyDate, shortDate, addDays, daysBetween,
  durationDays, workdays, enrichTask, refreshAutoProgress,
  computeAutoProgress, computeCriticalPath,
  nowLabel, parseCSVText, generateCSV, downloadFile,
};

</script>

<script type="text/babel">
// Gantt timeline component — uses window.SCHEDULE + groupColorMap prop
const { useState, useEffect, useMemo } = React;

// ── Zoom levels ───────────────────────────────────────────────────────────────
const ZOOM_LEVELS = {
  day:     { dayPx: 28,  label: "Day"     },
  week:    { dayPx: 10,  label: "Week"    },
  month:   { dayPx: 4,   label: "Month"   },
  quarter: { dayPx: 1.6, label: "Quarter" },
};

// Days of padding added before the first task and after the last.
const TIMELINE_PAD_BEFORE_DAYS = 14;
const TIMELINE_PAD_AFTER_DAYS  = 21;

// Minimum bar width in px — keeps very short tasks clickable.
const MIN_BAR_PX = 3;

// ── Timeline tier selection ───────────────────────────────────────────────────
function getTiersForDayPx(dayPx) {
  if (dayPx >= 16) return { primary: "month",   secondary: "day"     };
  if (dayPx >= 5)  return { primary: "month",   secondary: "week"    };
  if (dayPx >= 2)  return { primary: "quarter", secondary: "month"   };
  return                  { primary: "year",    secondary: "quarter" };
}

// ── Timeline builder ──────────────────────────────────────────────────────────
function buildTimeline(tasks, dayPx) {
  const S = window.SCHEDULE;
  if (!tasks.length) return null;

  let minDate = S.toD(tasks[0].s);
  let maxDate = S.toD(tasks[0].e);
  tasks.forEach(t => {
    const s = S.toD(t.s), e = S.toD(t.e);
    if (s < minDate) minDate = s;
    if (e > maxDate) maxDate = e;
  });

  minDate = S.addDays(minDate, -TIMELINE_PAD_BEFORE_DAYS);
  maxDate = S.addDays(maxDate,  TIMELINE_PAD_AFTER_DAYS);

  const totalDays = Math.round((maxDate - minDate) / 86_400_000) + 1;
  const totalPx   = totalDays * dayPx;

  // ── Month buckets ────────────────────────────────────────────────────────
  const months = [];
  let cur = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
  while (cur <= maxDate) {
    const y = cur.getFullYear(), m = cur.getMonth();
    const lastDay = new Date(y, m + 1, 0);
    const from    = new Date(Math.max(cur, minDate));
    const to      = new Date(Math.min(lastDay, maxDate));
    months.push({
      label:  cur.toLocaleString("en-US", { month: "short" }),
      year:   y,
      month:  m,
      days:   Math.round((to - from) / 86_400_000) + 1,
      offset: Math.round((from - minDate) / 86_400_000),
    });
    cur = new Date(y, m + 1, 1);
  }

  // ── Quarter buckets ──────────────────────────────────────────────────────
  const quarters = [];
  let qCur = new Date(minDate.getFullYear(), Math.floor(minDate.getMonth() / 3) * 3, 1);
  while (qCur <= maxDate) {
    const y = qCur.getFullYear(), q = Math.floor(qCur.getMonth() / 3) + 1;
    const lastDay = new Date(y, qCur.getMonth() + 3, 0);
    const from    = new Date(Math.max(qCur, minDate));
    const to      = new Date(Math.min(lastDay, maxDate));
    quarters.push({
      label:     `Q${q}`,
      fullLabel: `Q${q} ${y}`,
      year:      y,
      days:      Math.round((to - from) / 86_400_000) + 1,
      offset:    Math.round((from - minDate) / 86_400_000),
    });
    qCur = new Date(y, qCur.getMonth() + 3, 1);
  }

  // ── Year buckets ─────────────────────────────────────────────────────────
  const years = [];
  let yCur = new Date(minDate.getFullYear(), 0, 1);
  while (yCur <= maxDate) {
    const y       = yCur.getFullYear();
    const lastDay = new Date(y, 11, 31);
    const from    = new Date(Math.max(yCur, minDate));
    const to      = new Date(Math.min(lastDay, maxDate));
    years.push({
      label:  String(y),
      days:   Math.round((to - from) / 86_400_000) + 1,
      offset: Math.round((from - minDate) / 86_400_000),
    });
    yCur = new Date(y + 1, 0, 1);
  }

  // ── Week markers (Monday-aligned) ────────────────────────────────────────
  const weeks = [];
  let wCur = new Date(minDate);
  while (wCur.getDay() !== 1) wCur = S.addDays(wCur, 1);
  while (wCur <= maxDate) {
    weeks.push({
      offset: Math.round((wCur - minDate) / 86_400_000),
      label:  wCur.toLocaleString("en-US", { month: "short", day: "numeric" }),
    });
    wCur = S.addDays(wCur, 7);
  }

  return { min: minDate, max: maxDate, totalDays, totalPx, months, quarters, years, weeks };
}

// ── Header ────────────────────────────────────────────────────────────────────
function GanttHeader({ timeline, dayPx }) {
  if (!timeline) return null;
  const { primary, secondary } = getTiersForDayPx(dayPx);

  const tierData = {
    year:    timeline.years,
    quarter: timeline.quarters,
    month:   timeline.months,
    // Convert week markers to width-bearing buckets
    week: timeline.weeks.map((w, i, arr) => ({
      label:  w.label,
      offset: w.offset,
      days:   (arr[i + 1]?.offset ?? timeline.totalDays) - w.offset,
    })),
  };

  return (
    <div className="gantt-header" style={{ width: timeline.totalPx }}>
      <div className="gantt-header-row gantt-header-primary">
        {tierData[primary].map((b, i) => (
          <div key={i} className="gantt-header-cell" style={{ left: b.offset * dayPx, width: b.days * dayPx }}>
            {primary === "month"
              ? <><span className="m">{b.label}</span><span className="y">{b.year}</span></>
              : <span>{b.fullLabel || b.label}</span>}
          </div>
        ))}
      </div>
      <div className="gantt-header-row gantt-header-secondary">
        {secondary === "day" ? (
          Array.from({ length: timeline.totalDays }, (_, i) => {
            const d   = window.SCHEDULE.addDays(timeline.min, i);
            const dow = d.getDay();
            const isWeekend = dow === 0 || dow === 6;
            return (
              <div
                key={i}
                className={"gantt-header-day " + (isWeekend ? "weekend" : "")}
                style={{ left: i * dayPx, width: dayPx }}
              >
                <span className="dnum">{d.getDate()}</span>
              </div>
            );
          })
        ) : (
          tierData[secondary].map((b, i) => (
            <div key={i} className="gantt-header-cell sub" style={{ left: b.offset * dayPx, width: b.days * dayPx }}>
              {b.label}
            </div>
          ))
        )}
      </div>
    </div>
  );
}

// ── Grid ──────────────────────────────────────────────────────────────────────
function GanttGrid({ timeline, dayPx, todayOffset, rowCount, rowHeight, groupRowSet }) {
  if (!timeline) return null;
  const { secondary } = getTiersForDayPx(dayPx);
  const totalH        = rowCount * rowHeight;

  const gridLines = [];
  timeline.months.forEach((m, i) => {
    if (i > 0) gridLines.push({ x: m.offset * dayPx, kind: "month" });
  });
  if (secondary === "day" || secondary === "week") {
    timeline.weeks.forEach(w => {
      if (w.offset > 0) gridLines.push({ x: w.offset * dayPx, kind: "week" });
    });
  }

  // Weekend bands — only rendered at day zoom to avoid thousands of elements.
  const weekendBands = [];
  if (secondary === "day") {
    for (let i = 0; i < timeline.totalDays; i++) {
      const d   = window.SCHEDULE.addDays(timeline.min, i);
      const dow = d.getDay();
      if (dow === 0 || dow === 6) weekendBands.push({ x: i * dayPx, w: dayPx });
    }
  }

  return (
    <div className="gantt-grid" style={{ width: timeline.totalPx, height: totalH }}>
      {weekendBands.map((b, i) => (
        <div key={"wb" + i} className="grid-band-weekend" style={{ left: b.x, width: b.w, height: totalH }}/>
      ))}
      {gridLines.map((l, i) => (
        <div key={"gl" + i} className={"grid-line grid-line-" + l.kind} style={{ left: l.x, height: totalH }}/>
      ))}
      {[...groupRowSet].map((rowIdx, i) => (
        <div key={"gb" + i} className="grid-group-band"
             style={{ top: rowIdx * rowHeight, width: timeline.totalPx, height: rowHeight }}/>
      ))}
      {todayOffset != null && (
        <div className="today-line" style={{ left: todayOffset * dayPx, height: totalH }}>
          <div className="today-flag">
            TODAY · {new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" })}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Dependency arrows ─────────────────────────────────────────────────────────
function DependencyArrows({ tasks, taskById, visibleRows, timeline, dayPx, rowHeight, criticalIds, showCriticalPath }) {
  if (!timeline || !tasks.length) return null;
  const S = window.SCHEDULE;

  // taskId → row index (memoised — avoids O(n²) on every render)
  const rowIdxMap = useMemo(() => {
    const map = {};
    visibleRows.forEach((r, i) => { if (r.kind === "task") map[r.task.id] = i; });
    return map;
  }, [visibleRows]);

  const offsetDays = dateStr => Math.round((S.toD(dateStr) - timeline.min) / 86_400_000);

  const arrows = [];
  tasks.forEach(t => {
    (t.deps || []).forEach(predId => {
      if (!taskById[predId]) return;
      const pred = taskById[predId];
      const pi   = rowIdxMap[pred.id];
      const si   = rowIdxMap[t.id];
      if (pi === undefined || si === undefined) return; // collapsed or filtered out

      const x1 = (offsetDays(pred.e) + 1) * dayPx; // right edge of predecessor bar
      const y1 = pi * rowHeight + rowHeight / 2;
      const x2 = Math.max(0, offsetDays(t.s) * dayPx); // left edge of successor bar
      const y2 = si * rowHeight + rowHeight / 2;

      let d;
      if (x2 > x1 + 4) {
        // Straight elbow when there is horizontal room.
        d = `M ${x1} ${y1} H ${(x1 + x2) / 2} V ${y2} H ${x2}`;
      } else {
        // Route around: jog right → drop below both rows → come back left.
        const jog  = x1 + 14;
        const base = Math.max(y1, y2) + rowHeight * 0.5;
        d = `M ${x1} ${y1} H ${jog} V ${base} H ${x2 - 14} V ${y2} H ${x2}`;
      }

      const isCritical = showCriticalPath && criticalIds.has(pred.id) && criticalIds.has(t.id);
      arrows.push({ d, isCritical, key: `${predId}->${t.id}` });
    });
  });

  if (!arrows.length) return null;
  const totalH = visibleRows.length * rowHeight;

  return (
    <svg
      className="dep-svg"
      width={timeline.totalPx}
      height={totalH}
      style={{ position: "absolute", inset: 0, pointerEvents: "none", zIndex: 5, overflow: "visible" }}
    >
      <defs>
        <marker id="arr-crit" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#E24B4A"/>
        </marker>
        <marker id="arr-norm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#AABFC9"/>
        </marker>
      </defs>
      {arrows.map(a => (
        <path
          key={a.key}
          d={a.d}
          fill="none"
          strokeWidth="1.5"
          strokeLinecap="round"
          strokeLinejoin="round"
          stroke={a.isCritical ? "#E24B4A" : "#AABFC9"}
          markerEnd={a.isCritical ? "url(#arr-crit)" : "url(#arr-norm)"}
        />
      ))}
    </svg>
  );
}

// ── Bar ───────────────────────────────────────────────────────────────────────
function Bar({ task, timeline, dayPx, rowIndex, rowHeight, color, onSelect, onUpdate, selected, criticalPathIds, showCriticalPath }) {
  const S      = window.SCHEDULE;
  const sOff   = Math.round((S.toD(task.s) - timeline.min) / 86_400_000);
  const dur    = S.daysBetween(task.s, task.e) + 1;
  const left   = sOff * dayPx;
  const width  = Math.max(dur * dayPx, MIN_BAR_PX);
  const top    = rowIndex * rowHeight + (rowHeight - 22) / 2;
  const fillW  = Math.max(0, Math.min(100, task.pct)) / 100 * width;

  const [drag, setDrag] = useState(null);

  useEffect(() => {
    if (!drag) return;

    const onMouseMove = e => {
      const deltaDays = Math.round((e.clientX - drag.startX) / dayPx);
      let newS = drag.origS, newE = drag.origE;

      if (drag.mode === "move") {
        newS = S.fmtDate(S.addDays(S.toD(drag.origS), deltaDays));
        newE = S.fmtDate(S.addDays(S.toD(drag.origE), deltaDays));
      } else if (drag.mode === "left") {
        newS = S.fmtDate(S.addDays(S.toD(drag.origS), deltaDays));
        if (S.daysBetween(newS, newE) < 0) newS = newE;
      } else {
        newE = S.fmtDate(S.addDays(S.toD(drag.origE), deltaDays));
        if (S.daysBetween(newS, newE) < 0) newE = newS;
      }
      onUpdate(task.id, { s: newS, e: newE });
    };

    const onMouseUp = () => setDrag(null);

    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseup",   onMouseUp);
    return () => {
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("mouseup",   onMouseUp);
    };
  }, [drag, dayPx]); // dayPx in deps so delta recalculates if zoom changes mid-drag

  const startDrag = mode => e => {
    e.stopPropagation();
    e.preventDefault();
    setDrag({ mode, startX: e.clientX, origS: task.s, origE: task.e });
  };

  const isCritical = showCriticalPath && criticalPathIds && criticalPathIds.has(task.id);
  const isDimmed   = showCriticalPath && criticalPathIds && criticalPathIds.size > 0 && !criticalPathIds.has(task.id);

  if (task.milestone) {
    const size = Math.min(rowHeight - 8, 16);
    return (
      <div
        className={
          "milestone" +
          (selected      ? " selected"     : "") +
          (isCritical    ? " cp-critical"  : "") +
          (isDimmed      ? " cp-dimmed"    : "")
        }
        style={{ left: left + (dayPx / 2) - size / 2, top: top + (22 - size) / 2, width: size, height: size, background: color }}
        onClick={e => { e.stopPropagation(); onSelect(task.id); }}
        onMouseDown={startDrag("move")}
        title={task.name + " — " + S.prettyDate(task.s)}
      />
    );
  }

  return (
    <div
      className={
        "bar" +
        (selected   ? " selected"         : "") +
        " status-" + task.status +
        (isCritical ? " cp-critical"      : "") +
        (isDimmed   ? " cp-dimmed"        : "")
      }
      style={{ left, top, width, "--bar-color": color }}
      onClick={e => { e.stopPropagation(); onSelect(task.id); }}
    >
      <div className="bar-handle bar-handle-left"  onMouseDown={startDrag("left")}/>
      <div className="bar-fill" style={{ width: fillW }}/>
      <div className="bar-body" onMouseDown={startDrag("move")}>
        {width > 60 && (
          <span className="bar-label">
            {task.name}
            {task.pct > 0 && task.pct < 100 && <span className="bar-pct"> · {task.pct}%</span>}
          </span>
        )}
      </div>
      <div className="bar-handle bar-handle-right" onMouseDown={startDrag("right")}/>
    </div>
  );
}

// ── Gantt root ────────────────────────────────────────────────────────────────
function Gantt({ visibleRows, dayPx, timeline, selectedId, onSelect, onUpdateTask,
                 rowHeight = 36, todayDate, groupColorMap, allTasks,
                 criticalPathIds, showCriticalPath, activeBaseline, baselines, ghostStyle }) {
  if (!timeline) return null;

  const S         = window.SCHEDULE;
  const today     = todayDate || new Date();
  const todayOff  = (today >= timeline.min && today <= timeline.max)
    ? Math.round((today - timeline.min) / 86_400_000)
    : null;

  const groupRowSet = new Set();
  visibleRows.forEach((r, i) => { if (r.kind === "group") groupRowSet.add(i); });

  // Build taskById for dependency arrow rendering (memoised)
  const taskById = useMemo(() => {
    const map = {};
    (allTasks || []).forEach(t => { map[t.id] = t; });
    return map;
  }, [allTasks]);

  return (
    <div className="gantt-pane">
      <div className="gantt-header-sticky">
        <GanttHeader timeline={timeline} dayPx={dayPx}/>
      </div>
      <div className="gantt-body" style={{ position: "relative" }}>
        <GanttGrid
          timeline={timeline}
          dayPx={dayPx}
          todayOffset={todayOff}
          rowCount={visibleRows.length}
          rowHeight={rowHeight}
          groupRowSet={groupRowSet}
        />
        <DependencyArrows
          tasks={allTasks || []}
          taskById={taskById}
          visibleRows={visibleRows}
          timeline={timeline}
          dayPx={dayPx}
          rowHeight={rowHeight}
          criticalIds={criticalPathIds || new Set()}
          showCriticalPath={!!showCriticalPath}
        />
        {/* Baseline ghost bars — v3 */}
        {activeBaseline && (() => {
          const bl = (baselines || []).find(b => b.id === activeBaseline);
          return bl ? (
            <window.BaselineGhostBars
              baseline={bl}
              tasks={allTasks || []}
              timeline={timeline}
              dayPx={dayPx}
              rowHeight={rowHeight}
              visibleRows={visibleRows}
              groupColorMap={groupColorMap}
              ghostStyle={ghostStyle}
            />
          ) : null;
        })()}
        {visibleRows.map((row, i) => {
          if (row.kind === "group") return null;
          const t = row.task;
          return (
            <Bar
              key={t.id}
              task={t}
              timeline={timeline}
              dayPx={dayPx}
              rowIndex={i}
              rowHeight={rowHeight}
              color={groupColorMap[t.group] || "#888"}
              selected={selectedId === t.id}
              onSelect={onSelect}
              onUpdate={onUpdateTask}
              criticalPathIds={criticalPathIds || new Set()}
              showCriticalPath={!!showCriticalPath}
            />
          );
        })}
      </div>
    </div>
  );
}

window.Gantt         = Gantt;
window.buildTimeline = buildTimeline;
window.ZOOM_LEVELS   = ZOOM_LEVELS;

</script>

<script type="text/babel">
// Side panel — receives groups as prop
const { useState, useEffect, useRef } = React;

function PartyBadge({ party, size = 24 }) {
  if (!party) return null;
  const abbr = party.abbr || party.name.slice(0, 2).toUpperCase();
  return (
    <div
      className="party-badge"
      title={party.name}
      style={{ width: size, height: size, background: party.color, fontSize: Math.round(size * 0.38) }}
    >
      {abbr}
    </div>
  );
}

function StatusPill({ status }) {
  const S = window.SCHEDULE;
  const s = S.STATUSES.find(x => x.id === status) || S.STATUSES[0];
  return (
    <span className="status-pill" style={{ background: s.swatch, color: s.color, borderColor: s.color + "40" }}>
      <span className="status-dot" style={{ background: s.color }}/>
      {s.label}
    </span>
  );
}

function SidePanel({ task, parties, groups, onClose, onUpdate, onDelete, notes, onAddNote, allTasks, onOpenLinkBuilder }) {
  const S = window.SCHEDULE;
  const [draft,       setDraft]       = useState("");
  const [sheetState,  setSheetState]  = useState("peek"); // "peek" | "full" — mobile only
  const [isDragging,  setIsDragging]  = useState(false);
  const [dragY,       setDragY]       = useState(0);

  /*
   * v4 SPRING DRAG TRACKING
   * dragRef tracks: startY (touch origin), lastY (prev frame), lastTime, velocity (px/ms)
   * Velocity is used at touchEnd to detect a fast flick even if delta < threshold.
   * Dismiss threshold: velocity > 0.5 px/ms OR delta > 80px (spec).
   * Tap threshold: |delta| < 12px → toggle peek/full.
   * MAGIC NUMBER: 0.5 px/ms = approx iOS "fast swipe" heuristic.
   */
  const dragRef = useRef({ startY: 0, lastY: 0, lastTime: 0, velocity: 0 });

  // Clear draft + reset sheet to peek whenever the selected task changes.
  useEffect(() => { setDraft(""); }, [task?.id]);
  useEffect(() => { setSheetState("peek"); setDragY(0); setIsDragging(false); }, [task?.id]);

  if (!task) return null;

  // ── Mobile sheet touch handlers — spring physics ─────────────────────────
  const onHandleTouchStart = e => {
    e.stopPropagation();
    const y = e.touches[0].clientY;
    dragRef.current = { startY: y, lastY: y, lastTime: Date.now(), velocity: 0 };
    setIsDragging(true);
    setDragY(0);
  };

  const onHandleTouchMove = e => {
    e.preventDefault(); // block scroll while dragging handle
    const y   = e.touches[0].clientY;
    const now = Date.now();
    const dt  = Math.max(1, now - dragRef.current.lastTime);
    // velocity in px/ms (positive = downward)
    dragRef.current.velocity = (y - dragRef.current.lastY) / dt;
    dragRef.current.lastY    = y;
    dragRef.current.lastTime = now;
    const delta = y - dragRef.current.startY;
    // Clamp: only allow downward drag (positive delta); resist pulling up past 0
    setDragY(Math.max(0, delta));
  };

  const onHandleTouchEnd = () => {
    const delta    = dragRef.current.lastY - dragRef.current.startY;
    const velocity = dragRef.current.velocity;
    setIsDragging(false);
    setDragY(0); // spring back to snap target

    // Fast flick OR large drag → dismiss (swipe-down-to-close)
    if (velocity > 0.5 || delta > 80) {
      onClose();
    } else if (Math.abs(delta) < 12) {
      // Tap (tiny movement) → toggle peek ↔ full
      setSheetState(s => s === 'peek' ? 'full' : 'peek');
    }
    // else: spring back to current sheetState (dragY already 0)
  };

  // Tap on the handle bar itself also toggles (desktop / mouse click)
  const onHandleClick = () => setSheetState(s => s === 'peek' ? 'full' : 'peek');

  const party     = parties.find(p => p.id === task.party) || null;
  const group     = groups.find(g => g.name === task.group) || groups[0];
  const groupClr  = group?.color || "#888";
  const dur       = S.durationDays(task);
  const wd        = S.workdays(task);
  const taskNotes = notes.filter(n => n.taskId === task.id);
  const set       = patch => onUpdate(task.id, patch);

  const postNote = () => {
    const text = draft.trim();
    if (!text) return;
    onAddNote(task.id, text);
    setDraft("");
  };

  return (
    <aside
      className={[
        'side-panel',
        `sheet-${sheetState}`,
        isDragging ? 'sheet-dragging' : '',
      ].filter(Boolean).join(' ')}
      style={isDragging && dragY > 0 ? { transform: `translateY(${dragY}px)` } : undefined}
    >
      {/* Grip bar — 36px × 3px per v4 spec */}
      <div
        className="sheet-handle-bar"
        onClick={onHandleClick}
        onTouchStart={onHandleTouchStart}
        onTouchMove={onHandleTouchMove}
        onTouchEnd={onHandleTouchEnd}
        title="Tap to expand · swipe down to close"
        role="button"
        aria-label={sheetState === 'peek' ? 'Expand panel' : 'Collapse panel'}
      />
      <div className="panel-head">
        <div className="panel-head-top">
          <div className="group-tag" style={{ background: groupClr + "1a", color: groupClr }}>
            <span className="dot" style={{ background: groupClr }}/>
            {task.group}
          </div>
          <button className="icon-btn" onClick={onClose} aria-label="Close">×</button>
        </div>
        <input
          className="panel-title"
          value={task.name}
          onChange={e => set({ name: e.target.value })}
        />
      </div>

      <div className="panel-body">
        <div className="panel-row">
          <label>Status</label>
          <select value={task.status} onChange={e => set({ status: e.target.value })}>
            {S.STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>

        <div className="panel-row">
          <label>Progress</label>
          <div className="progress-row">
            <input type="range" min="0" max="100" step="5" value={task.pct}
                   onChange={e => set({ pct: +e.target.value })}/>
            <span className="mono">{task.pct}%</span>
          </div>
        </div>

        <div className="panel-row split">
          <div>
            <label>Start</label>
            <input type="date" value={task.s} onChange={e => set({ s: e.target.value })}/>
          </div>
          <div>
            <label>End</label>
            <input type="date" value={task.e} onChange={e => set({ e: e.target.value })}/>
          </div>
        </div>

        <div className="panel-row meta-grid">
          <div>
            <span className="meta-k">Duration</span>
            <span className="mono meta-v">{dur} days</span>
          </div>
          <div>
            <span className="meta-k">Working days</span>
            <span className="mono meta-v">~{wd}</span>
          </div>
        </div>

        <div className="panel-row">
          <label>Responsible party</label>
          <div className="party-select-row">
            {party && <PartyBadge party={party} size={22}/>}
            <select value={task.party || ""} onChange={e => set({ party: e.target.value || null })}>
              <option value="">Unassigned</option>
              {parties.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>

        <div className="panel-row">
          <label>Phase</label>
          <select value={task.group} onChange={e => set({ group: e.target.value })}>
            {groups.map(g => <option key={g.id} value={g.name}>{g.name}</option>)}
          </select>
        </div>

        <div className="panel-row">
          <label className="checkbox-label">
            <input type="checkbox" checked={!!task.milestone}
                   onChange={e => set({ milestone: e.target.checked })}/>
            <span>Mark as milestone</span>
          </label>
        </div>

        <div className="panel-row">
          <label>Task notes</label>
          <textarea rows="3" value={task.notes || ""}
                    onChange={e => set({ notes: e.target.value })}
                    placeholder="Scope, contacts, risks…"/>
        </div>

        {/* ── Actual Dates (v3) ────────────────────────────────────── */}
        <div className="actual-dates-section">
          <div className="actual-dates-title">
            Actual dates
            {task.status === 'complete' && (
              <span className="actual-status-pill"
                    style={{ background: 'var(--color-selected-bg)', color: 'var(--accent)' }}>
                ✓ Complete
              </span>
            )}
          </div>
          <div className="panel-row split">
            <div>
              <label>Actual start</label>
              <input
                type="date"
                value={task.actualStart || ''}
                disabled={task.status === 'not_started'}
                onChange={e => set({ actualStart: e.target.value || null })}
                style={{ opacity: task.status === 'not_started' ? 0.4 : 1 }}
              />
            </div>
            <div>
              <label>Actual finish</label>
              <input
                type="date"
                value={task.actualFinish || ''}
                disabled={task.status === 'not_started'}
                onChange={e => set({ actualFinish: e.target.value || null })}
                style={{ opacity: task.status === 'not_started' ? 0.4 : 1 }}
              />
            </div>
          </div>
          {task.actualStart && task.actualFinish &&
           S.toD(task.actualFinish) < S.toD(task.actualStart) && (
            <div className="actual-date-error">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" style={{ flexShrink: 0, marginTop: 1 }}>
                <circle cx="6.5" cy="6.5" r="5.5" stroke="currentColor" strokeWidth="1.3"/>
                <path d="M6.5 4v3M6.5 9v.4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
              </svg>
              Actual finish cannot be before actual start.
            </div>
          )}
          {task.status === 'not_started' && (
            <div style={{ fontSize: 11, color: 'var(--color-text-dim)', lineHeight: 1.45, marginTop: 4 }}>
              Set status to In Progress or complete to record actual dates.
            </div>
          )}
        </div>

        {/* Dependencies */}
        {allTasks && allTasks.length > 1 && (
          <div className="panel-section">
            <div className="panel-section-title">
              Dependencies
              <span className="count">{(task.deps || []).length}</span>
            </div>
            <p style={{ fontSize: 11, color: "var(--ink-4)", marginBottom: 10, lineHeight: 1.5 }}>
              Select tasks that must finish before this one starts.
            </p>
            <div className="dep-list">
              {allTasks.filter(t => t.id !== task.id).map(t => {
                const checked  = (task.deps || []).includes(t.id);
                const grpColor = groups.find(g => g.name === t.group)?.color || "#888";
                return (
                  <label key={t.id} className={"dep-item" + (checked ? " dep-item-checked" : "")}>
                    <input
                      type="checkbox"
                      checked={checked}
                      onChange={e => {
                        const next = e.target.checked
                          ? [...(task.deps || []), t.id]
                          : (task.deps || []).filter(id => id !== t.id);
                        set({ deps: next });
                      }}
                    />
                    <span className="dep-swatch" style={{ background: grpColor }}/>
                    <span className="dep-name">{t.name}</span>
                    <span className="dep-date">{S.shortDate(t.e)}</span>
                  </label>
                );
              })}
            </div>
          </div>
        )}

        <div className="panel-section">
          <div className="panel-section-title">
            Log
            <span className="count">{taskNotes.length}</span>
          </div>
          <div className="note-list">
            {taskNotes.length === 0 && (
              <div className="note-empty">
                No entries yet — use this to track updates, decisions, and blockers.
              </div>
            )}
            {taskNotes.map(n => (
              <div key={n.id} className="note-item">
                <div className="note-text">{n.text}</div>
                <div className="note-when">{n.when}</div>
              </div>
            ))}

<script type="text/babel">
// CSV import dialog with column mapping
const { useState } = React;

const CSV_PREVIEW_ROW_COUNT = 3;

const FIELD_DEFS = [
  { id: "name",      label: "Task Name",         required: true  },
  { id: "start",     label: "Start Date",        required: true  },
  { id: "end",       label: "End Date",          required: true  },
  { id: "phase",     label: "Phase",             required: false },
  { id: "status",    label: "Status",            required: false },
  { id: "progress",  label: "Progress (%)",      required: false },
  { id: "party",     label: "Responsible Party", required: false },
  { id: "milestone", label: "Milestone",         required: false },
  { id: "notes",     label: "Notes",             required: false },
];

// Lowercase header strings that map to each field id.
const HEADER_CANDIDATES = {
  name:      ["task name","task","name","title","description","activity","item"],
  start:     ["start date","start","begin","from","commencement","commenced"],
  end:       ["end date","end","finish","to","completion","due","complete"],
  phase:     ["phase","group","category","section","discipline","workstream"],
  status:    ["status","state","stage"],
  progress:  ["progress","% complete","% done","percent complete","completion %","complete %"],
  party:     ["party","responsible","assigned to","assignee","owner","contractor","resource"],
  milestone: ["milestone","is milestone","key milestone","flag"],
  notes:     ["notes","description","comments","remarks","detail"],
};

function autoDetectMapping(headers) {
  const mapping = {};
  FIELD_DEFS.forEach(field => {
    const candidates = HEADER_CANDIDATES[field.id] || [];
    mapping[field.id] = headers.find(h => candidates.includes(h.toLowerCase())) || "";
  });
  return mapping;
}

/**
 * Parse a YYYY-MM-DD string or any date string into a YYYY-MM-DD string.
 * Uses explicit UTC parsing to avoid timezone-shift ±1 day bugs.
 * Throws a descriptive Error if the value cannot be understood.
 */
function normalizeDate(raw) {
  const trimmed = raw.trim();

  // Already in ISO format — accept as-is without constructing a Date object.
  if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) return trimmed;

  // Try the common locale formats via Date.parse, then re-emit in UTC.
  const ms = Date.parse(trimmed);
  if (isNaN(ms)) throw new Error(`Cannot parse date: "${trimmed}"`);

  // Re-format using UTC accessors to avoid local-timezone day shifts.
  const d = new Date(ms);
  const y  = d.getUTCFullYear();
  const mo = String(d.getUTCMonth() + 1).padStart(2, "0");
  const dy = String(d.getUTCDate()).padStart(2, "0");
  return `${y}-${mo}-${dy}`;
}

function CsvImportDialog({ rawText, groups, parties, onImport, onCancel }) {
  const S = window.SCHEDULE;
  const { headers, rows } = S.parseCSVText(rawText);
  const preview = rows.slice(0, CSV_PREVIEW_ROW_COUNT);

  const [mapping, setMapping] = useState(() => autoDetectMapping(headers));
  const [mode,    setMode]    = useState("replace"); // "replace" | "append"
  const [error,   setError]   = useState(null);

  const requiredMapped = FIELD_DEFS.filter(f => f.required).every(f => mapping[f.id]);
  const getVal = (row, fieldId) => row[mapping[fieldId]] || "";

  const handleImport = () => {
    setError(null);
    const today    = new Date();
    const imported = [];
    const errs     = [];

    rows.forEach((row, i) => {
      const name = getVal(row, "name").trim();
      const rawS = getVal(row, "start").trim();
      const rawE = getVal(row, "end").trim();

      if (!name || !rawS || !rawE) {
        errs.push(`Row ${i + 2}: missing name, start, or end`);
        return;
      }

      let startStr, endStr;
      try {
        startStr = normalizeDate(rawS);
        endStr   = normalizeDate(rawE);
      } catch (e) {
        errs.push(`Row ${i + 2}: ${e.message}`);
        return;
      }

      // Phase — fall back to first group if unrecognised.
      const rawPhase = getVal(row, "phase");
      const phase    = groups.find(g => g.name.toLowerCase() === rawPhase.toLowerCase())?.name
                    || groups[0]?.name
                    || "Planning";

      // Status — accept either id ("in_progress") or label ("In progress").
      const rawStatus  = getVal(row, "status");
      const matchedStatus = S.STATUSES.find(
        s => s.id === rawStatus || s.label.toLowerCase() === rawStatus.toLowerCase()
      );
      const status = matchedStatus?.id || null;

      // Progress — clamp to [0, 100].
      const rawPct = parseInt(getVal(row, "progress"), 10);
      const pct    = isNaN(rawPct) ? null : Math.max(0, Math.min(100, rawPct));

      // Party — match by name (case-insensitive).
      const rawParty = getVal(row, "party");
      const party    = parties.find(
        p => p.name.toLowerCase() === rawParty.toLowerCase()
      )?.id || null;

      const rawMilestone = getVal(row, "milestone").toLowerCase();
      const milestone    = rawMilestone === "yes" || rawMilestone === "true" || rawMilestone === "1";

      const task = {
        id:           "t" + Date.now() + "-" + i,
        name,
        group:        phase,
        s:            startStr,
        e:            endStr,
        notes:        getVal(row, "notes") || "",
        party,
        milestone,
        manualStatus: !!status,
        manualPct:    pct !== null,
        deps:         [],
      };

      const auto  = S.computeAutoProgress(task.s, task.e, today);
      task.status = status || auto.status;
      task.pct    = pct !== null ? pct : auto.pct;

      imported.push(task);
    });

    if (errs.length) {
      const shown = errs.slice(0, 5).join("\n");
      const tail  = errs.length > 5 ? `\n…and ${errs.length - 5} more` : "";
      setError(shown + tail);
      return;
    }

    onImport(imported, mode);
  };

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal-box" style={{ width: 560, maxWidth: "95vw" }}>
        <div className="modal-head">
          <h3>Import CSV — map columns</h3>
          <button className="icon-btn" onClick={onCancel}>×</button>
        </div>
        <div className="modal-body">
          <p className="modal-hint">
            Match your CSV columns to the schedule fields. Task Name, Start Date, and
            End Date are required.
          </p>

          {preview.length > 0 && (
            <div className="csv-preview">
              <div className="csv-preview-label">
                Preview — {rows.length} row{rows.length !== 1 ? "s" : ""} detected
              </div>
              <div className="csv-preview-scroll">
                <table className="csv-preview-table">
                  <thead>
                    <tr>{headers.map((h, i) => <th key={i}>{h}</th>)}</tr>
                  </thead>
                  <tbody>
                    {preview.map((row, i) => (
                      <tr key={i}>{headers.map((h, j) => <td key={j}>{row[h]}</td>)}</tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          <div className="csv-map-grid">
            {FIELD_DEFS.map(f => (
              <div key={f.id} className="csv-map-row">
                <label className={"csv-map-label" + (f.required ? " req" : "")}>
                  {f.label}{f.required && <span className="req-star"> *</span>}
                </label>
                <select
                  value={mapping[f.id]}
                  onChange={e => setMapping(m => ({ ...m, [f.id]: e.target.value }))}
                >
                  <option value="">— skip —</option>
                  {headers.map((h, i) => <option key={i} value={h}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>

          <div className="csv-mode-row">
            <span className="csv-mode-label">Import mode</span>
            <div className="zoom-tabs">
              {[["replace", "Replace all tasks"], ["append", "Append to existing"]].map(([v, lbl]) => (
                <button key={v} className={mode === v ? "active" : ""} onClick={() => setMode(v)}>
                  {lbl}
                </button>
              ))}
            </div>
          </div>

          {error && (
            <div className="csv-error">
              <strong>Issues found:</strong>
              <pre>{error}</pre>
            </div>
          )}
        </div>
        <div className="modal-foot">
          <button className="ghost-btn" onClick={onCancel}>Cancel</button>
          <button className="primary-btn" disabled={!requiredMapped} onClick={handleImport}>
            Import {rows.length} task{rows.length !== 1 ? "s" : ""}
          </button>
        </div>
      </div>
    </div>
  );
}

/**
 * Opens a native file picker restricted to .csv files,
 * reads the selected file as UTF-8 text, then calls onLoad with the raw string.
 * Logs and surfaces an alert on read failure.
 */
function triggerCSVImport(onLoad) {
  const input    = document.createElement("input");
  input.type     = "file";
  input.accept   = ".csv,text/csv";

  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader      = new FileReader();
    reader.onload     = ev => onLoad(ev.target.result, file.name);
    reader.onerror    = () => {
      console.error("[CSV import] FileReader error reading:", file.name, reader.error);
      alert(`Could not read "${file.name}". Please try again.`);
    };
    reader.readAsText(file, "UTF-8");
  };

  input.click();
}

window.CsvImportDialog  = CsvImportDialog;
window.triggerCSVImport = triggerCSVImport;

</script>

<script type="text/babel">
// ── UndoToast ──────────────────────────────────────────────────────────────
// Props: message (plain text), highlight (bolded task name / action), onUndo?, onDismiss, durationMs
// Replaces dangerouslySetInnerHTML with structured props for XSS safety.
const { useState: useStateUT, useEffect: useEffectUT } = React;

function UndoToast({ message, highlight, onUndo, onDismiss, durationMs = 5000 }) {
  const [progress, setProgress] = useStateUT(100);

  useEffectUT(() => {
    const start = Date.now();
    const tick  = () => {
      const elapsed = Date.now() - start;
      const pct     = Math.max(0, 100 - (elapsed / durationMs) * 100);
      setProgress(pct);
      if (pct > 0) requestAnimationFrame(tick);
      else onDismiss();
    };
    const raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  return (
    <div className="undo-toast" role="status" aria-live="polite" aria-atomic="true">
      <span className="toast-icon">↩</span>
      <span className="toast-msg">
        {message}{highlight && <> <strong>{highlight}</strong></>}
      </span>
      {onUndo && (
        <button className="toast-undo" onClick={() => { onUndo(); onDismiss(); }}>
          Undo
        </button>
      )}
      <button className="toast-close" onClick={onDismiss} aria-label="Dismiss">×</button>
      <div className="toast-timer" style={{ width: progress + "%" }}/>
    </div>
  );
}

window.UndoToast = UndoToast;
</script>

<script type="text/babel">
// ── BaselineMenu + BaselineGhostBars ───────────────────────────────────────

const BASELINE_COLORS = ["#27aae1","#7F77DD","#1D9E75","#EF9F27","#E24B4A"];

function BaselineMenu({ baselines, activeBaselineId, onToggle, onLock, onDelete }) {

  useEffectBL(() => {
    const handler = e => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  const activeLabel = activeBaselineId
    ? baselines.find(b => b.id === activeBaselineId)?.name || "Baseline"
    : "Baseline";

  return (
    <div className="baseline-menu-wrap" ref={wrapRef}>
      <button
        className={"ghost-btn" + (activeBaselineId ? " ghost-btn-active" : "")}
        onClick={() => setOpen(v => !v)}
        title="Baseline & variance tracking"
      >
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <line x1="1" y1="6.5" x2="12" y2="6.5" stroke="currentColor" strokeWidth="1.3" strokeDasharray="2 1.5"/>
          <rect x="3" y="3.5" width="4" height="6" rx="1" stroke="currentColor" strokeWidth="1.2"/>
          <rect x="8.5" y="4" width="3" height="5" rx="1" fill="currentColor" opacity="0.45"/>

}

function BaselineGhostBars({ baseline, tasks, timeline, dayPx, rowHeight, visibleRows, groupColorMap, ghostStyle }) {
  if (!baseline || !timeline) return null;
  const S = window.SCHEDULE;

  /*
   * v4 GHOST STYLE VARIANTS
   * ghostStyle: 'stripe' (default) | 'solid' | 'outline'
   * CSS classes: .ghost-stripe / .ghost-solid / .ghost-outline
   * MAGIC NUMBER: slipDays threshold 3 — variance labels only when
   * shift is meaningful (< 3 days could be rounding noise).
   */
  const styleClass = {
    stripe:  'ghost-stripe',
    solid:   'ghost-solid',
    outline: 'ghost-outline',
  }[ghostStyle || 'stripe'] || 'ghost-stripe';

  const baselineById = {};
  baseline.tasks.forEach(t => { baselineById[t.id] = t; });

  const bars = [];
  visibleRows.forEach((row, rowIndex) => {
    if (row.kind !== "task") return;
    const orig = baselineById[row.task.id];
    if (!orig) return;

    const sOff  = Math.round((S.toD(orig.s) - timeline.min) / 86_400_000);
    const dur   = S.daysBetween(orig.s, orig.e) + 1;
    const left  = sOff * dayPx;
    const width = Math.max(dur * dayPx, 3);
    const top   = rowIndex * rowHeight + rowHeight / 2 + 4;
    const color = groupColorMap[orig.group] || "#888";

    const curSOff  = Math.round((S.toD(row.task.s) - timeline.min) / 86_400_000);
    const slipDays = Math.round((S.toD(row.task.s) - S.toD(orig.s)) / 86_400_000);

    bars.push(
      <React.Fragment key={row.task.id + "-ghost"}>
        <div
          className={`bar-ghost ${styleClass}`}
          style={{ left, top, width, color }}
          title={`Baseline: ${S.shortDate(orig.s)} → ${S.shortDate(orig.e)}`}
        />
        {Math.abs(slipDays) >= 3 && (
          <div
            className={"variance-arrow " + (slipDays > 0 ? "slip" : "ahead")}
            style={{
              left: Math.min(left, curSOff * dayPx) - 2,
              top:  rowIndex * rowHeight + (rowHeight - 16) / 2,
            }}
          >
            {slipDays > 0 ? `+${slipDays}d ▶` : `${slipDays}d ◀`}
          </div>
        )}
      </React.Fragment>
    );
  });

  return <>{bars}</>;
}

window.BaselineMenu       = BaselineMenu;
window.BaselineGhostBars  = BaselineGhostBars;
window.BASELINE_COLORS    = BASELINE_COLORS;
</script>

<script type="text/babel">
// ── LinkBuilderModal ────────────────────────────────────────────────────────
const { useState: useStateLB, useMemo: useMemoLB } = React;

const DEP_TYPES = [
  { id: "FS", label: "Finish → Start",  desc: "Successor starts after predecessor finishes" },
  { id: "SS", label: "Start → Start",   desc: "Successor starts after predecessor starts"   },
  { id: "FF", label: "Finish → Finish", desc: "Successor finishes after predecessor finishes"},
  { id: "SF", label: "Start → Finish",  desc: "Successor finishes after predecessor starts"  },
];

function detectCircular(tasks, sourceId, targetId, existingDeps) {
  // BFS from targetId following deps — if we reach sourceId, it's circular
  const adj = {};
  tasks.forEach(t => {
    adj[t.id] = [...(existingDeps[t.id] || t.deps || [])];
  });
  // Hypothetically add the new edge
  if (!adj[targetId]) adj[targetId] = [];

  const visited = new Set();
  const queue   = [targetId];
  while (queue.length) {
    const cur = queue.shift();
    if (cur === sourceId) return true;
    if (visited.has(cur)) continue;
    visited.add(cur);
    (adj[cur] || []).forEach(p => queue.push(p));
  }
  return false;
}

function LinkBuilderModal({ tasks, task, groups, onClose, onSave }) {
  const S = window.SCHEDULE;
  const [search,    setSearch]   = useStateLB("");
  const [selected,  setSelected] = useStateLB(task?.deps || []);
  const [depType,   setDepType]  = useStateLB("FS");
  const [lag,       setLag]      = useStateLB(0);

  const filtered = useMemoLB(() => {
    const q = search.toLowerCase();
    return tasks.filter(t => t.id !== task?.id && t.name.toLowerCase().includes(q));
  }, [tasks, task, search]);

  const hasCircular = useMemoLB(() => {
    return selected.some(predId => {
      if (!task) return false;
      return detectCircular(tasks, predId, task.id, {});
    });
  }, [selected, task, tasks]);

  const toggle = id => {
    setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  };

  return (
    <div className="modal-overlay link-builder-modal"
         onClick={e => { if (e.target.classList.contains("modal-overlay")) onClose(); }}>
      <div className="modal-box" style={{ width: 560 }}>
        <div className="modal-head">
          <h3>Link dependencies — <em style={{ fontWeight: 400, color: "var(--color-text-secondary)" }}>{task?.name}</em></h3>
          <button className="icon-btn" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <p className="modal-hint">
            Select predecessor tasks that must complete before <strong>{task?.name}</strong> can begin.
            Circular dependencies are detected automatically.
          </p>

          {hasCircular && (
            <div className="circular-dep-error">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ flexShrink: 0 }}>
                <circle cx="8" cy="8" r="7" stroke="currentColor" strokeWidth="1.5"/>
                <path d="M8 5v4M8 11v.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
              <span>
                <strong>Circular dependency detected.</strong> One or more selected tasks would create a loop.
                Remove the conflicting selection before saving.
              </span>
            </div>
          )}

          <div className="link-builder-search">
            <input
              type="text"
              placeholder="Search tasks…"
              value={search}
              onChange={e => setSearch(e.target.value)}
              style={{ width: "100%", height: 32 }}
              autoFocus
            />
          </div>

          <div className="link-builder-list">
            {filtered.map(t => {
              const color   = groups.find(g => g.name === t.group)?.color || "#888";
              const checked = selected.includes(t.id);
              return (
                <label key={t.id} className={"lb-task-item" + (checked ? " selected" : "")}>
                  <input
                    type="checkbox"
                    checked={checked}
                    onChange={() => toggle(t.id)}
                    style={{ accentColor: "var(--accent)" }}
                  />
                  <span style={{ width: 8, height: 8, borderRadius: 2, background: color, flexShrink: 0 }}/>
                  <span className="lb-task-name">{t.name}</span>
                  <span className="lb-task-date">{S.shortDate(t.e)}</span>
                </label>
              );
            })}
            {filtered.length === 0 && (
              <div style={{ padding: "var(--space-4)", textAlign: "center", color: "var(--color-text-dim)", fontSize: "var(--text-sm)" }}>
                No tasks match your search.
              </div>
            )}
          </div>

          <div className="lb-type-row">
            <div>
              <label>Dependency type</label>
              <select value={depType} onChange={e => setDepType(e.target.value)} style={{ width: "100%" }}>
                {DEP_TYPES.map(d => (
                  <option key={d.id} value={d.id}>{d.id} — {d.label}</option>
                ))}
              </select>
              <div style={{ fontSize: 10, color: "var(--color-text-dim)", marginTop: 4, lineHeight: 1.4 }}>
                {DEP_TYPES.find(d => d.id === depType)?.desc}
              </div>
            </div>
            <div>
              <label>Lag / lead (days)</label>
              <input
                type="number"
                value={lag}
                onChange={e => setLag(+e.target.value)}
                style={{ width: "100%" }}
                min="-999" max="999"
              />
              <div style={{ fontSize: 10, color: "var(--color-text-dim)", marginTop: 4, lineHeight: 1.4 }}>
                Positive = lag (delay). Negative = lead (overlap).
              </div>
            </div>
          </div>
        </div>
        <div className="modal-foot">
          <span className="foot-hint">{selected.length} predecessor{selected.length !== 1 ? "s" : ""} selected</span>
          <div style={{ display: "flex", gap: "var(--space-2)" }}>
            <button className="ghost-btn" onClick={onClose}>Cancel</button>
            <button
              className="primary-btn"
              disabled={hasCircular}
              onClick={() => onSave(selected, depType, lag)}
            >
              Save links
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

window.LinkBuilderModal = LinkBuilderModal;
</script>

<script type="text/babel">
