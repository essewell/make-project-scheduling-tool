<script type="text/babel">
// ── PrintPreviewModal ──────────────────────────────────────────────────────
// Simulates A3 landscape 2-column layout at zoom: 0.55
// Shows readability analysis + three mode options
const { useState: useStatePP, useMemo: useMemoP } = React;

const PRINT_SCALE   = 0.55;
// A3 landscape content area at 96dpi (420mm × 297mm, 12/16mm margins)
const A3_W = 1587; // ≈ 388mm × 3.78 + padding
const A3_H = 1122; // ≈ 273mm × 3.78 + padding
const PRINT_TL_W = 220;   // task list column width at 1× (print px)
const PRINT_ROW_H = 20;   // row height at 1× (print px)
const PRINT_HDR_H = 36;   // brand header height
const PRINT_TL_HEAD_H = 22; // col header
const PRINT_GANTT_HDR_H = 28; // gantt header

/*
 * MAGIC NUMBER: PRINT_DAY_PX_BASE = 4 (month zoom equivalent).
 * This is what fits a typical 2-year project into A3 at 0.55 scale.
 * Displayed pixel = PRINT_DAY_PX_BASE × PRINT_SCALE ≈ 2.2px/day.
 * Labels render at 8px; readable threshold is ≈ 25px bar width,
 * which equates to tasks > 11 calendar days.
 */
const PRINT_DAY_PX_BASE = 4;

const STATUS_SHORT = {
  not_started: { label: 'N/S',      color: '#9C9A92' },
  in_progress: { label: 'Active',   color: '#1D9E75' },
  at_risk:     { label: 'At Risk',  color: '#EF9F27' },
  delayed:     { label: 'Delayed',  color: '#E24B4A' },
  complete:    { label: 'Done',     color: '#185FA5' },
};

function PrintPreviewModal({ tasks, groups, groupColorMap, projectName, onClose, onPrint }) {
  const S = window.SCHEDULE;
  const [mode, setMode] = useStatePP('gantt'); // 'gantt' | 'summary'

  // Build timeline for the print Gantt
  const timeline = useMemoP(() => window.buildTimeline(tasks, PRINT_DAY_PX_BASE), [tasks]);

  // Readability analysis
  const readability = useMemoP(() => {
    if (!timeline) return { illegible: 0, marginal: 0, total: tasks.length };
    let illegible = 0, marginal = 0;
    tasks.forEach(t => {
      if (t.milestone) return;
      const dur = S.daysBetween(t.s, t.e) + 1;
      const printPx = dur * PRINT_DAY_PX_BASE * PRINT_SCALE;
      if (printPx < 16)  illegible++;
      else if (printPx < 30) marginal++;
    });
    return { illegible, marginal, total: tasks.filter(t => !t.milestone).length };
  }, [tasks, timeline]);

  // Build ordered rows (group headers + tasks)
  const rows = useMemoP(() => {
    const byGroup = {};
    tasks.forEach(t => { (byGroup[t.group] = byGroup[t.group] || []).push(t); });
    const result = [];
    groups.forEach(g => {
      const items = byGroup[g.name];
      if (!items?.length) return;
      result.push({ kind: 'group', group: g.name, color: g.color });
      items.sort((a,b) => S.toD(a.s) - S.toD(b.s));
      items.forEach(t => result.push({ kind: 'task', task: t }));
    });
    return result;
  }, [tasks, groups]);

  const totalContentH = rows.length * PRINT_ROW_H;
  const pageH = Math.max(A3_H, PRINT_HDR_H + PRINT_TL_HEAD_H + totalContentH + 24);
  const ganttW = A3_W - PRINT_TL_W;
  const today = new Date();
  const todayOff = timeline
    ? Math.round((today - timeline.min) / 86_400_000)
    : null;

  return (
    <div className="print-preview-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="print-preview-chrome">

        {/* ── Head ── */}
        <div className="print-preview-head">
          <h3>Print preview</h3>
          <span className="print-preview-badge">A3 Landscape · zoom 0.55</span>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 'var(--space-3)' }}>
            {/* Readability chip */}
            {readability.illegible > 0 ? (
              <span className="print-readability-chip warn">
                <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
                  <circle cx="5.5" cy="5.5" r="5" stroke="currentColor" strokeWidth="1.2"/>
                  <path d="M5.5 3.5v2.8M5.5 8v.3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                </svg>
                {readability.illegible} task{readability.illegible !== 1 ? 's' : ''} too narrow to label
              </span>
            ) : (
              <span className="print-readability-chip ok">
                <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
                  <circle cx="5.5" cy="5.5" r="5" stroke="currentColor" strokeWidth="1.2"/>
                  <path d="M3.5 5.5l1.5 1.5 2.5-2.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                All task labels legible at 0.55
              </span>
            )}
            <button className="icon-btn" onClick={onClose} title="Close">×</button>
          </div>
        </div>

        {/* ── Body — scrollable paper tray ── */}
        <div className="print-preview-body">
          <div className="print-page-wrap">
            <div className="print-page-label">
              {mode === 'gantt' ? '2-column A3 · Gantt + task list' : mode === 'summary' ? 'Summary table' : 'Task list only'}
            </div>

            {/* The A3 "paper" — scaled to 55% */}
            <div
              className="print-page"
              style={{
                width: A3_W,
                minHeight: pageH,
                transform: `scale(${PRINT_SCALE})`,
                transformOrigin: 'top left',
                marginBottom: `calc(${pageH}px * ${PRINT_SCALE - 1})`, // collapse empty scaled space
              }}
            >
              {/* Brand header bar */}
              <div className="print-page-header">
                <span className="print-page-header-title">MAKE — {projectName}</span>
                <span className="print-page-header-date">
                  Printed {today.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                </span>
              </div>

              {mode === 'summary' ? (
                /* ── Summary table mode ── */
                <div style={{ padding: '12px 16px', overflowX: 'hidden' }}>
                  <table className="print-summary-table">
                    <thead>
                      <tr>
                        <th style={{ width: 30 }}>#</th>
                        <th>Task</th>
                        <th>Phase</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th>Progress</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map((row, i) => {
                        if (row.kind === 'group') return (
                          <tr key={'g'+i} className="print-summary-group">
                            <td colSpan={8}>
                              <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 2,
                                             background: row.color, marginRight: 5, verticalAlign: 'middle' }}/>
                              {row.group}
                            </td>
                          </tr>
                        );
                        const t  = row.task;
                        const wbs = (() => {
                          let gi = 0, tc = {};
                          rows.slice(0, i+1).forEach(r => {
                            if (r.kind === 'group') gi++;
                            else if (r.task?.group === t.group) tc[t.group] = (tc[t.group]||0)+1;
                          });
                          return `${gi}.${tc[t.group]||1}`;
                        })();
                        const dur = S.daysBetween(t.s, t.e) + 1;
                        const st  = STATUS_SHORT[t.status] || STATUS_SHORT.not_started;
                        return (
                          <tr key={t.id}>
                            <td style={{ fontFamily: 'monospace', fontSize: 8, color: '#7894a6' }}>{i}</td>
                            <td style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                              <span style={{ width: 3, height: 10, borderRadius: 1,
                                background: groupColorMap[t.group] || '#888', flexShrink: 0 }}/>
                              {t.milestone && <span style={{ fontSize: 8 }}>◆</span>}
                              {t.name}
                            </td>
                            <td style={{ color: groupColorMap[t.group] || '#888' }}>{t.group}</td>
                            <td style={{ fontFamily: 'monospace', fontSize: 8 }}>{S.shortDate(t.s)}</td>
                            <td style={{ fontFamily: 'monospace', fontSize: 8 }}>{S.shortDate(t.e)}</td>
                            <td style={{ fontFamily: 'monospace', fontSize: 8 }}>{dur}d</td>
                            <td style={{ color: st.color, fontWeight: 600, fontSize: 8 }}>{st.label}</td>
                            <td>
                              <div style={{ width: 50, height: 5, background: '#dce3ea', borderRadius: 2, overflow: 'hidden' }}>
                                <div style={{ width: t.pct + '%', height: '100%', background: groupColorMap[t.group] || '#888' }}/>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              ) : (
                /* ── 2-column Gantt mode ── */
                <div className={'print-body-cols' + (mode === 'list' ? ' summary-mode' : '')}>
                  {/* Left: task list column */}
                  <div className="print-tl">
                    <div className="print-tl-head">
                      <div>Task</div>
                      <div style={{ textAlign: 'right' }}>Status</div>
                      <div style={{ textAlign: 'right' }}>Dates</div>
                    </div>
                    <div className="print-tl-body">
                      {rows.map((row, i) => {
                        if (row.kind === 'group') return (
                          <div key={'g'+i} className="print-tl-group">
                            <div className="print-tl-group-dot" style={{ background: row.color }}/>
                            <div className="print-tl-group-name" style={{ color: row.color }}>{row.group}</div>
                          </div>
                        );
                        const t  = row.task;
                        const st = STATUS_SHORT[t.status] || STATUS_SHORT.not_started;
                        return (
                          <div key={t.id} className="print-tl-row" style={{ height: PRINT_ROW_H }}>
                            <div className="print-tl-name-cell">
                              <div className="print-tl-bar" style={{ background: groupColorMap[t.group] || '#888' }}/>
                              {t.milestone && <span style={{ fontSize: 8, color: groupColorMap[t.group] }}>◆</span>}
                              <span className="print-tl-name" title={t.name}>{t.name}</span>
                            </div>
                            <div className="print-tl-status" style={{ color: st.color }}>{st.label}</div>
                            <div className="print-tl-dates">
                              {S.shortDate(t.s)}<br/>{S.shortDate(t.e)}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Right: Gantt column */}
                  {mode === 'gantt' && timeline && (
                    <div className="print-gantt-col">
                      {/* Header: month labels */}
                      <div className="print-gantt-header">
                        {timeline.months.map((m, i) => (
                          <div key={i} className="print-gantt-header-cell"
                               style={{ left: m.offset * PRINT_DAY_PX_BASE, width: m.days * PRINT_DAY_PX_BASE }}>
                            {m.label} {m.year}
                          </div>
                        ))}
                      </div>
                      {/* Bars */}
                      <div className="print-gantt-body" style={{ width: timeline.totalPx }}>
                        {/* Today line */}
                        {todayOff != null && (
                          <div className="print-today-line" style={{ left: todayOff * PRINT_DAY_PX_BASE }}/>
                        )}
                        {rows.map((row, i) => {
                          if (row.kind === 'group') return null;
                          const t     = row.task;
                          const color = groupColorMap[t.group] || '#888';
                          const sOff  = Math.round((S.toD(t.s) - timeline.min) / 86_400_000);
                          const dur   = S.daysBetween(t.s, t.e) + 1;
                          const left  = sOff * PRINT_DAY_PX_BASE;
                          const width = Math.max(dur * PRINT_DAY_PX_BASE, 2);
                          const top   = i * PRINT_ROW_H + (PRINT_ROW_H - 14) / 2;
                          const fillW = Math.max(0, Math.min(100, t.pct)) / 100 * width;
                          // Legibility flag
                          const tooNarrow = width * PRINT_SCALE < 16;
                          if (t.milestone) {
                            const sz = 9;
                            return (
                              <div key={t.id} style={{
                                position: 'absolute',
                                left: left - sz/2, top: top + (14-sz)/2,
                                width: sz, height: sz,
                                background: color,
                                transform: 'rotate(45deg)',
                                borderRadius: 1,
                              }}/>
                            );
                          }
                          return (
                            <div key={t.id} className="print-gantt-bar" style={{ left, top, width, background: color,
                                 outline: tooNarrow ? '1px dashed rgba(191,59,46,0.60)' : 'none' }}>
                              <div className="print-gantt-bar-fill" style={{ width: fillW }}/>
                              {!tooNarrow && (
                                <span className="print-gantt-bar-label">{t.name}</span>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Readability legend */}
            {readability.illegible > 0 && mode === 'gantt' && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6,
                            fontSize: 11, color: 'rgba(255,255,255,0.60)' }}>
                <span style={{ display: 'inline-block', width: 14, height: 8, border: '1px dashed rgba(191,59,46,0.75)',
                               borderRadius: 2, background: 'rgba(191,59,46,0.08)' }}/>
                Bars outlined in red are too narrow to show labels at print scale
              </div>
            )}
          </div>
        </div>

        {/* ── Foot ── */}
        <div className="print-preview-foot">
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-3)' }}>
            <span style={{ fontSize: 'var(--text-xs)', color: 'var(--color-text-tertiary)' }}>
              View:
            </span>
            <div className="print-mode-tabs">
              {[
                ['gantt',   '2-col Gantt'],
                ['summary', 'Summary table'],
              ].map(([v, lbl]) => (
                <button
                  key={v}
                  className={'print-mode-btn' + (mode === v ? ' active' : '')}
                  onClick={() => setMode(v)}
                >
                  {lbl}
                </button>
              ))}
            </div>
            {readability.illegible > 0 && mode === 'gantt' && (
              <span style={{ fontSize: 'var(--text-xs)', color: 'var(--color-text-tertiary)' }}>
                Tip: try <strong>Summary table</strong> for better legibility on short tasks.
              </span>
            )}
          </div>
          <div style={{ display: 'flex', gap: 'var(--space-2)', alignItems: 'center' }}>
            <button className="ghost-btn-light" onClick={onClose}>Close</button>
            <button className="primary-btn" onClick={onPrint}>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <rect x="1.5" y="3.5" width="9" height="6" rx="1" stroke="currentColor" strokeWidth="1.2"/>
                <path d="M3.5 3.5V2h5v1.5" stroke="currentColor" strokeWidth="1.2"/>
                <path d="M3.5 7h5M3.5 9h3" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                <circle cx="9.5" cy="5.5" r="0.8" fill="currentColor"/>
              </svg>
              Print / Save PDF
            </button>
          </div>
        </div>

      </div>
    </div>
  );
}

window.PrintPreviewModal = PrintPreviewModal;
</script>

<script type="text/babel">
// Main app — universal project schedule tool
const {
  useState, useEffect, useMemo, useRef, useCallback,
} = React;

const STORAGE_KEY = "schedule-tool-v1";
const ROW_HEIGHT  = 36;

// ── Persistence ───────────────────────────────────────────────────────────────

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (err) {
    console.error("[Schedule] Failed to load saved state:", err);
    return null;
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error("[Schedule] Failed to persist state:", err);
  }
}

function todayMidnight() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// ── Editable project title ────────────────────────────────────────────────────
function EditableTitle({ value, onChange }) {
  const [editing, setEditing] = useState(false);
  const [draft,   setDraft]   = useState(value);
  const inputRef              = useRef(null);

  useEffect(() => {
    if (editing && inputRef.current) inputRef.current.select();
  }, [editing]);

  const commit = () => {
    const committed = draft.trim() || value;
    setDraft(committed);
    onChange(committed);
    setEditing(false);
  };

  if (editing) {
    return (
      <input
        ref={inputRef}
        className="brand-title-input"
        value={draft}
        onChange={e => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={e => {
          if (e.key === "Enter")  commit();
          if (e.key === "Escape") { setDraft(value); setEditing(false); }
        }}
      />
    );
  }

  return (
    <div
      className="brand-title editable-title"
      onClick={() => { setDraft(value); setEditing(true); }}
      title="Click to rename"
    >
      {value}
      <span className="edit-hint">✎</span>
    </div>
  );
}

// ── Empty state ───────────────────────────────────────────────────────────────
function EmptyState({ onAddTask, onImport }) {
  return (
    <div className="empty-state-wrap">
      <div className="empty-state">
        <svg width="80" height="60" viewBox="0 0 80 60" fill="none" style={{ marginBottom: 20 }}>
          {/* Bar tracks */}
          <rect x="4"  y="9"  width="46" height="9" rx="3" fill="var(--accent-dim)" stroke="var(--color-border)" strokeWidth="0.75"/>
          <rect x="18" y="27" width="50" height="9" rx="3" fill="var(--accent-dim)" stroke="var(--color-border)" strokeWidth="0.75"/>
          <rect x="10" y="45" width="34" height="9" rx="3" fill="var(--accent-dim)" stroke="var(--color-border)" strokeWidth="0.75"/>
          {/* Progress fills */}
          <rect x="4"  y="9"  width="30" height="9" rx="3" fill="var(--accent)" opacity="0.30"/>
          <rect x="18" y="27" width="16" height="9" rx="3" fill="var(--accent)" opacity="0.30"/>
          {/* Today line */}
          <line x1="34" y1="3" x2="34" y2="57" stroke="var(--accent)" strokeWidth="1.5" strokeDasharray="2 2"/>
          <rect x="27" y="0" width="14" height="6" rx="1.5" fill="var(--accent)"/>

}

// ── Top bar ───────────────────────────────────────────────────────────────────
function TopBar({ projectName, onRenameProject, stats, zoom, setZoom,

  return (
    <React.Fragment>
    <header className="topbar">
      <div className="brand">
        <span className="make-wordmark">MAKE</span>
        <div className="brand-divider"></div>
        <div className="brand-text">
          <EditableTitle value={projectName} onChange={onRenameProject}/>

      </div>

      <div className="topbar-right">
        <div className="zoom-tabs">

            <rect x="1" y="8" width="8" height="3" rx="1.5" stroke="currentColor" strokeWidth="1.2"/>
            <rect x="8" y="2" width="4" height="3" rx="1.5" stroke="currentColor" strokeWidth="1.2"/>
          </svg>
          Phases
        </button>
        <button className="ghost-btn" onClick={onManageParties}>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <circle cx="6.5" cy="4" r="2.2" stroke="currentColor" strokeWidth="1.3"/>
            <path d="M2 11c0-2.2 2-4 4.5-4s4.5 1.8 4.5 4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
          </svg>
          Parties
        </button>
        <div className="topbar-sep"/>
        <div style={{ position: 'relative' }}>
          <window.BaselineMenu
            baselines={baselines}
            activeBaselineId={activeBaseline}
            onToggle={onToggleBaseline}
            onLock={onLockBaseline}
            onDelete={onDeleteBaseline}
          />
          {/* v4 onboarding tip — shown after 3+ tasks exist, never if user has locked a baseline */}
          {showBaselineTip && (
            <div className="baseline-onboarding-tip" role="tooltip">
              <strong>Track schedule variance</strong>
              Lock the current plan as a baseline snapshot. The Gantt will then show ghost bars + slip/gain labels against your live schedule.
              <span className="tip-dismiss">Click Baseline → Lock to start</span>
            </div>
          )}
        </div>
        <div className="topbar-sep"/>
        <button className="ghost-btn" onClick={onImportCSV} title="Import CSV">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M6.5 1.5v7M4 6.5l2.5 2.5 2.5-2.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M2 10.5h9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
          </svg>
          Import
        </button>
        <button className="ghost-btn" onClick={onExportCSV} title="Export CSV">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M6.5 9V2M4 4l2.5-2.5L9 4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M2 10.5h9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
          </svg>
          Export
        </button>
        <button className="ghost-btn" onClick={onPrint} title="Export PDF / Print">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <rect x="2" y="4" width="9" height="6" rx="1" stroke="currentColor" strokeWidth="1.2"/>
            <path d="M4 4V2h5v2" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
            <path d="M4 8h5M4 10h3" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
            <circle cx="10" cy="6.5" r="0.9" fill="currentColor"/>
          </svg>
          PDF
        </button>
        <div className="topbar-sep"/>
        <button className="ghost-btn" onClick={onManageWorkweek} title="Working days &amp; calendar">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <rect x="1.5" y="2.5" width="10" height="9" rx="1.2" stroke="currentColor" strokeWidth="1.2"/>
            <path d="M1.5 5.5h10" stroke="currentColor" strokeWidth="1.2"/>
            <path d="M4.5 1.5v2M8.5 1.5v2" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
            <rect x="4" y="7" width="2" height="2" rx="0.5" fill="currentColor" opacity="0.6"/>
            <rect x="7" y="7" width="2" height="2" rx="0.5" fill="currentColor" opacity="0.6"/>
          </svg>
        </button>
        {cpAvailable && (
          <button
            className={"ghost-btn" + (showCriticalPath ? " ghost-btn-active" : "")}
            onClick={onToggleCriticalPath}
            title="Toggle critical path highlight"
          >
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <circle cx="2"  cy="6.5" r="1.5" fill={showCriticalPath ? "#E24B4A" : "currentColor"}/>
              <circle cx="11" cy="6.5" r="1.5" fill={showCriticalPath ? "#E24B4A" : "currentColor"}/>
              <line x1="3.5" y1="6.5" x2="9.5" y2="6.5" stroke={showCriticalPath ? "#E24B4A" : "currentColor"} strokeWidth="1.4" strokeDasharray="1.5 1.5"/>
            </svg>
            Critical Path
          </button>
        )}
        <button className="ghost-btn small" onClick={onReset} title="Reset / new project">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M2 6.5a4.5 4.5 0 1 0 1.4-3.2M2 2v3h3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
        {/* v4: N-key badge — appears on hover to teach the keyboard shortcut */}

    <div className="stat-bar">

      <div className="stat">
        <div className="stat-k">Tasks</div>
        <div className="stat-v mono">{stats.total}</div>
      </div>
      <div className="stat">
        <div className="stat-k">Overall progress</div>

// ── Filter bar ────────────────────────────────────────────────────────────────
function FilterBar({ search, setSearch, groupFilter, setGroupFilter,
                     statusFilter, setStatusFilter, partyFilter, setPartyFilter,
                     tasks, parties, groups, visibleCount }) {
  const S = window.SCHEDULE;

  const usedGroups  = groups.filter(g => tasks.some(t => t.group === g.name));
  const usedParties = parties.filter(p => tasks.some(t => t.party === p.id));

  return (
    <div className="filter-bar">
      <div className="search-wrap">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <circle cx="5.5" cy="5.5" r="3.5" stroke="currentColor" strokeWidth="1.3"/>
          <path d="M8.5 8.5l3 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
        </svg>
        <input
          type="text"
          placeholder="Search tasks…"
          value={search}
          onChange={e => setSearch(e.target.value)}
        />
      </div>

      {usedGroups.length > 0 && (
        <div className="filter-group">
          <span className="filter-label">Phase</span>
          <button className={"chip" + (groupFilter === null ? " active" : "")} onClick={() => setGroupFilter(null)}>
            All
          </button>
          {usedGroups.map(g => (
            <button
              key={g.id}
              className={"chip" + (groupFilter === g.name ? " active" : "")}
              onClick={() => setGroupFilter(groupFilter === g.name ? null : g.name)}
              style={groupFilter === g.name ? { background: g.color + "1a", color: g.color, borderColor: g.color + "55" } : {}}
            >
              <span className="chip-dot" style={{ background: g.color }}/>
              {g.name}
            </button>
          ))}
        </div>
      )}

      <div className="filter-group">
        <span className="filter-label">Status</span>
        {S.STATUSES.map(s => (
          <button
            key={s.id}
            className={"chip" + (statusFilter === s.id ? " active" : "")}
            onClick={() => setStatusFilter(statusFilter === s.id ? null : s.id)}
            style={statusFilter === s.id ? { background: s.swatch, color: s.color, borderColor: s.color + "55" } : {}}
          >
            <span className="chip-dot" style={{ background: s.color }}/>
            {s.label}
          </button>
        ))}
      </div>

      {usedParties.length > 0 && (
        <div className="filter-group">
          <span className="filter-label">Party</span>
          <button className={"chip" + (partyFilter === null ? " active" : "")} onClick={() => setPartyFilter(null)}>
            All
          </button>
          {usedParties.map(p => (
            <button
              key={p.id}
              className={"chip" + (partyFilter === p.id ? " active" : "")}
              onClick={() => setPartyFilter(partyFilter === p.id ? null : p.id)}
              style={partyFilter === p.id ? { background: p.color + "1a", color: p.color, borderColor: p.color + "55" } : {}}
            >
              <span className="chip-dot" style={{ background: p.color }}/>
              {p.name}
            </button>
          ))}
        </div>
      )}

      <div className="filter-count">
        Showing <strong>{visibleCount}</strong> of {tasks.length}
      </div>
    </div>
  );
}


// ── Status badge ───────────────────────────────────────────────────────────────
function StatusBadge({ status }) {
  const BADGE = {
    not_started: { label: 'Not Started', bg: '#eeecea', color: '#8c8782' },
    in_progress: { label: 'On Track',    bg: '#d7efe3', color: '#1a8e69' },
    at_risk:     { label: 'At Risk',     bg: '#fbe8c7', color: '#b87408' },
    delayed:     { label: 'Delayed',     bg: '#f8d7d6', color: '#c03535' },
    complete:    { label: 'Complete',    bg: '#d6e2ef', color: '#185FA5' },
  };
  const cfg = BADGE[status] || BADGE.not_started;
  return (
    <span className="status-badge" style={{ background: cfg.bg, color: cfg.color }}>
      {cfg.label}
    </span>
  );
}


// ── Task list ─────────────────────────────────────────────────────────────────
function TaskList({ rows, rowHeight, onSelect, selectedId, onToggleGroup,
                    listRef, onScroll, parties, notes, groupColorMap, floatMap,
                    kbFocusId, completionFlashId }) {
  const S = window.SCHEDULE;

  // Build WBS map in a single pass
  let gNum = 0;
  const groupNums = {};
  const tCounts   = {};
  rows.forEach(row => {
    if (row.kind === 'group') { gNum++; groupNums[row.group] = gNum; }
  });
  const taskWbs = {};
  rows.forEach(row => {
    if (row.kind === 'task') {
      const g = row.task.group;
      tCounts[g] = (tCounts[g] || 0) + 1;
      if (groupNums[g]) taskWbs[row.task.id] = groupNums[g] + '.' + tCounts[g];
    }
  });

  return (
    <div className="task-list" ref={listRef} onScroll={onScroll}>
      <div className="task-list-head">
        <div>Task</div>
        <div>Party</div>
        <div>Dates</div>
        <div>Float</div>
      </div>
      <div className="task-list-body">
        {rows.map(row => {
          if (row.kind === 'group') {
            const color = groupColorMap[row.group] || '#888';
            const gN    = groupNums[row.group];
            return (
              <div
                key={'g' + row.group}
                className="row group-row"
                style={{ height: rowHeight }}
                onClick={() => onToggleGroup(row.group)}
              >
                <div className="group-caret" style={{ color }}>
                  <svg width="9" height="9" viewBox="0 0 9 9"
                    style={{ transform: row.collapsed ? 'rotate(-90deg)' : 'rotate(0deg)', transition: 'transform 0.15s ease', display: 'block' }}>
                    <path d="M1.5 3L4.5 6L7.5 3" stroke="currentColor" strokeWidth="1.6"
                          strokeLinecap="round" strokeLinejoin="round" fill="none"/>
                  </svg>
                </div>
                <div className="group-name" style={{ color }}>
                  {gN != null && <span className="wbs-group-num">{gN}</span>}
                  {row.group}
                </div>
                <div className="group-count">{row.count}</div>
              </div>
            );
          }

          const task      = row.task;
          const party     = parties.find(p => p.id === task.party) || null;
          const noteCount = notes.filter(n => n.taskId === task.id).length;
          const wbs       = taskWbs[task.id] || '';
          const floatVal  = floatMap ? floatMap[task.id] : undefined;
          const hasFloat  = floatVal !== undefined && isFinite(floatVal);
          const isNeg     = hasFloat && floatVal < 0;

          return (
            <div
              key={task.id}
              data-task-id={task.id}
              className={[
                'row task-row',
                selectedId === task.id   ? 'selected'         : '',
                kbFocusId === task.id    ? 'kb-focused'       : '',
                completionFlashId === task.id ? 'completion-flash' : '',
              ].filter(Boolean).join(' ')}
              style={{ height: rowHeight }}
              onClick={() => onSelect(task.id)}
            >
              <div className="tr-name">
                {wbs && <span className="wbs-num">{wbs}</span>}
                <div className="tr-name-bar" style={{ background: groupColorMap[task.group] || '#888' }}/>
                <div className="tr-name-text" title={task.name}>
                  {task.milestone && <span className="ms-glyph">◆</span>}
                  {task.name}
                </div>
                <StatusBadge status={task.status}/>
                {noteCount > 0 && (
                  <div className="note-badge" title={noteCount + ' log entries'}>
                    <svg width="11" height="11" viewBox="0 0 11 11">
                      <path d="M2 2h7v5H6.5L4.5 9V7H2V2z" stroke="currentColor" strokeWidth="1.1" fill="none" strokeLinejoin="round"/>
                    </svg>
                    {noteCount}
                  </div>
                )}
              </div>
              <div className="tr-party">
                {party
                  ? <div className="party-badge-sm" title={party.name} style={{ background: party.color }}>{party.abbr}</div>
                  : <span className="muted">—</span>}
              </div>
              <div className="tr-dates mono">
                <div>{S.shortDate(task.s)}</div>
                <div className="dim">{S.shortDate(task.e)}</div>
              </div>
              <div className={'tr-float' + (isNeg ? ' float-neg' : '')}>
                {hasFloat ? (floatVal > 0 ? '+' : '') + floatVal + 'd' : '—'}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}


// ── App root ──────────────────────────────────────────────────────────────────
function App() {
  const S = window.SCHEDULE;

  // ── Today ticker — updates state at midnight so progress auto-refreshes ──
  const [todayDate, setTodayDate] = useState(() => todayMidnight());
  useEffect(() => {
    function scheduleTick() {
      const now  = new Date();
      const msUntilMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) - now;
      const timer = setTimeout(() => {
        setTodayDate(todayMidnight());
        scheduleTick();
      }, msUntilMidnight + 100); // +100 ms buffer past midnight
      return timer;
    }
    const timer = scheduleTick();
    return () => clearTimeout(timer);
  }, []);

  // ── Bootstrap from localStorage ──
  const stored = useMemo(() => loadState(), []);
  const hasStoredData = !!(stored?.tasks?.length);

  const [showWizard,        setShowWizard]        = useState(!hasStoredData);
  const [projectName,       setProjectName]        = useState(stored?.projectName || "My Project");
  const [tasks,             setTasks]              = useState(() =>
    hasStoredData ? S.refreshAutoProgress(stored.tasks, todayMidnight()) : []
  );
  const [groups,            setGroups]             = useState(stored?.groups   || S.DEFAULT_GROUPS);
  const [parties,           setParties]            = useState(stored?.parties  || S.DEFAULT_PARTIES);
  const [notes,             setNotes]              = useState(stored?.notes    || []);
  const [collapsedGroups,   setCollapsedGroups]    = useState(stored?.collapsedGroups || []);

  // ── View state ──
  // zoom is the named level; dayPx is the derived pixel-per-day value.
  // They are kept in sync: setZoom always writes both.
  const [zoom,              setZoomKey]            = useState("week");
  const [dayPx,             setDayPx]              = useState(window.ZOOM_LEVELS["week"].dayPx);

  const [search,            setSearch]             = useState("");
  const [groupFilter,       setGroupFilter]        = useState(null);
  const [statusFilter,      setStatusFilter]       = useState(null);
  const [partyFilter,       setPartyFilter]        = useState(null);
  const [selectedId,        setSelectedId]         = useState(null);
  const [showGroups,        setShowGroups]         = useState(false);
  const [showParties,       setShowParties]        = useState(false);
  const [csvDialog,         setCsvDialog]          = useState(null);
  const [showCriticalPath,  setShowCriticalPath]   = useState(false);

  // ── v3 new feature state ─────────────────────────────────────────────────
  const [undoStack,        setUndoStack]         = useState([]);   // max 20 entries
  const [undoToast,        setUndoToast]         = useState(null); // {message, onUndo}
  const [baselines,        setBaselines]         = useState(stored?.baselines   || []);
  const [activeBaseline,   setActiveBaseline]    = useState(null); // id of overlay baseline
  const [workweek,         setWorkweek]          = useState(stored?.workweek    || { mon:true,tue:true,wed:true,thu:true,fri:true,sat:false,sun:false });
  const [holidays,         setHolidays]          = useState(stored?.holidays    || []);
  const [showWorkweek,     setShowWorkweek]       = useState(false);
  const [showLinkBuilder,  setShowLinkBuilder]   = useState(false);
  const [mobileTab,        setMobileTab]         = useState("list"); // "list" | "gantt"
  const [printLoading,     setPrintLoading]      = useState(false);
  const [kbFocusId,        setKbFocusId]         = useState(null);   // keyboard nav cursor
  const [completionFlashId,setCompletionFlashId] = useState(null);   // completionPulse trigger

  // ── v4 new state ──────────────────────────────────────────────────────────
  /*
   * ghostStyle: controls which ghost bar variant is shown when a baseline is active.
   *   'stripe'  — 45° diagonal stripes (default)
   *   'solid'   — 20% opacity solid fill
   *   'outline' — dashed border only
   */
  const [ghostStyle,       setGhostStyle]        = useState('stripe');
  const [showPrintPreview, setShowPrintPreview]  = useState(false);
  /*
   * onboardingPhase — progressive disclosure sequence for first-run users.
   *   'fresh'       → user just started, 0 tasks (empty state prominent CTA)
   *   'first_added' → first task created; Gantt pulses to draw attention
   *   'baseline_tip'→ 3+ tasks exist; contextual tooltip near Baseline button
   *   'complete'    → user has interacted with baseline; onboarding retired
   * Persisted to localStorage so it survives refreshes.
   * MAGIC NUMBER: 3 tasks = "baseline_tip" threshold — enough to make a
   * meaningful baseline, not so many that the tip feels late.
   */
  const [onboardingPhase,  setOnboardingPhase]   = useState(stored?.onboardingPhase || 'fresh');
  const [ganttPulse,       setGanttPulse]        = useState(false);

  // ── Refs ──
  const ganttScrollRef   = useRef(null);
  const listRef          = useRef(null);
  const syncingScroll    = useRef(false); // prevents scroll-sync feedback loops
  const visibleRowsRef   = useRef([]);    // always-current copy for keyboard handler
  const addTaskRef       = useRef(null);  // same for addTask

  // ── Side-effects ──

  useEffect(() => { document.title = projectName + " — Schedule"; }, [projectName]);

  // Keep always-current refs for keyboard handler (avoids stale closures)
  useEffect(() => { visibleRowsRef.current = visibleRows; }, [visibleRows]);
  useEffect(() => { addTaskRef.current = addTask; }, [addTask]);

  useEffect(() => {
    setTasks(ts => S.refreshAutoProgress(ts, todayDate));
  }, [todayDate]);

  useEffect(() => {
    if (!showWizard) {
      saveState({ projectName, tasks, groups, parties, notes, collapsedGroups,
                  baselines, workweek, holidays, onboardingPhase });
    }
  }, [projectName, tasks, groups, parties, notes, collapsedGroups,
      baselines, workweek, holidays, onboardingPhase, showWizard]);

  // ── v4 Onboarding progression ─────────────────────────────────────────────
  /*
   * Sequence:
   *   0 tasks    → 'fresh'        (empty state handles its own CTA)
   *   1st task   → 'first_added'  → Gantt pulses (2 cycles × 1.4s)
   *   3+ tasks   → 'baseline_tip' → tooltip near Baseline button (800ms delay)
   *   baseline locked → 'complete' → onboarding retired
   *
   * Example-data users bypass onboarding (tasks.length > 1 on first render
   * and onboardingPhase starts at 'fresh' → triggers first_added → immediately
   * qualifies for baseline_tip after the two nested effects run).
   * This is intentional — example data users still benefit from the baseline tip.
   */
  useEffect(() => {
    if (showWizard) return;
    if (onboardingPhase === 'complete') return;

    const n = tasks.length;

    // fresh → first_added: first task created
    if (n >= 1 && onboardingPhase === 'fresh') {
      setOnboardingPhase('first_added');
      setGanttPulse(true);
      const t = setTimeout(() => setGanttPulse(false), 3200); // 2 × 1.4s + 400ms buffer
      return () => clearTimeout(t);
    }

    // first_added → baseline_tip: 3+ tasks; slight delay so new tasks render first
    if (n >= 3 && onboardingPhase === 'first_added') {
      const t = setTimeout(() => setOnboardingPhase('baseline_tip'), 900);
      return () => clearTimeout(t);
    }

    // Any phase → complete: user has locked a baseline
    if (baselines.length > 0 && onboardingPhase !== 'complete') {
      setOnboardingPhase('complete');
    }
  }, [tasks.length, baselines.length, onboardingPhase, showWizard]);

  // Dismiss side panel on Escape; Ctrl+Z undo
  // Keyboard shortcuts: Escape · Ctrl+Z · N · ↑↓ · Space · Enter
  useEffect(() => {
    const inputTags    = new Set(['INPUT', 'TEXTAREA', 'SELECT']);
    const inputFocused = () => inputTags.has(document.activeElement?.tagName);

    const onKeyDown = e => {
      // Escape: dismiss panel
      if (e.key === 'Escape') { setSelectedId(null); setKbFocusId(null); return; }

      // Ctrl/Cmd+Z: undo
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        setUndoStack(stack => {
          if (!stack.length) return stack;
          const [top, ...rest] = stack;
          top.restore();
          setUndoToast({ message: 'Undone:', highlight: top.label, onUndo: null });
          return rest;
        });
        return;
      }

      // Guard: skip remaining shortcuts when a text field is focused
      if (inputFocused()) return;

      // N: add task
      if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        if (addTaskRef.current) addTaskRef.current();
        return;
      }

      // ↑ / ↓: navigate task rows (wraps at boundaries)
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const rows    = visibleRowsRef.current;
        const taskIds = rows.filter(r => r.kind === 'task').map(r => r.task.id);
        if (!taskIds.length) return;
        const cur  = taskIds.indexOf(kbFocusId);
        const next = e.key === 'ArrowDown'
          ? (cur < 0 ? 0 : (cur + 1) % taskIds.length)
          : (cur < 0 ? taskIds.length - 1 : (cur - 1 + taskIds.length) % taskIds.length);
        const nextId = taskIds[next];
        setKbFocusId(nextId);
        requestAnimationFrame(() => {
          const el = document.querySelector(`[data-task-id="${nextId}"]`);
          if (el && listRef.current) {
            const lTop = listRef.current.scrollTop;
            const lH   = listRef.current.clientHeight;
            const eTop = el.offsetTop;
            const eH   = el.offsetHeight;
            if (eTop < lTop)             listRef.current.scrollTop = eTop - 4;
            if (eTop + eH > lTop + lH)   listRef.current.scrollTop = eTop + eH - lH + 4;
          }
        });
        return;
      }

      // Space: select/deselect focused row
      if (e.key === ' ') {
        e.preventDefault();
        if (!kbFocusId) return;
        setSelectedId(id => id === kbFocusId ? null : kbFocusId);
        return;
      }

      // Enter: open side panel for focused row
      if (e.key === 'Enter') {
        e.preventDefault();
        if (kbFocusId) setSelectedId(kbFocusId);
        return;
      }
    };

    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [kbFocusId]); // kbFocusId in deps so ↑↓ closures stay fresh

  // Ctrl/Cmd + scroll wheel → zoom
  const onGanttWheel = useCallback(e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    setDayPx(px => Math.max(1, Math.min(80, px * (e.deltaY > 0 ? 0.88 : 1.14))));
  }, []);

  useEffect(() => {
    const el = ganttScrollRef.current;
    if (!el) return;
    el.addEventListener("wheel", onGanttWheel, { passive: false });
    return () => el.removeEventListener("wheel", onGanttWheel);
  }, [onGanttWheel]);

  // Jump to today when zoom level changes
  useEffect(() => {
    if (!ganttScrollRef.current || !timeline) return;
    if (todayDate < timeline.min || todayDate > timeline.max) return;
    const offsetDays = Math.round((todayDate - timeline.min) / 86_400_000);
    ganttScrollRef.current.scrollLeft = Math.max(0, offsetDays * dayPx - 240);
  }, [zoom, todayDate]); // intentionally omit dayPx/timeline — only fire on discrete zoom changes

  // ── Derived / memoised values ──

  const groupColorMap = useMemo(() => {
    const map = {};
    groups.forEach(g => { map[g.name] = g.color; });
    return map;
  }, [groups]);

  const timeline = useMemo(() => window.buildTimeline(tasks, dayPx), [tasks, dayPx]);

  const { criticalPathIds, floatMap, hasDeps } = useMemo(() => {
    const result = S.computeCriticalPath(tasks);
    return { criticalPathIds: result.criticalIds, floatMap: result.floatMap || {}, hasDeps: result.hasDeps };
  }, [tasks]);

  const filteredTasks = useMemo(() => tasks.filter(task => {
    if (search        && !task.name.toLowerCase().includes(search.toLowerCase())) return false;
    if (groupFilter   && task.group  !== groupFilter)  return false;
    if (statusFilter  && task.status !== statusFilter) return false;
    if (partyFilter   && task.party  !== partyFilter)  return false;
    return true;
  }), [tasks, search, groupFilter, statusFilter, partyFilter]);

  const visibleRows = useMemo(() => {
    const byGroup = {};
    filteredTasks.forEach(t => {
      (byGroup[t.group] = byGroup[t.group] || []).push(t);
    });

    const rows = [];
    groups.forEach(g => {
      const items = byGroup[g.name];
      if (!items?.length) return;
      const isCollapsed = collapsedGroups.includes(g.name);
      items.sort((a, b) => S.toD(a.s) - S.toD(b.s));
      rows.push({ kind: "group", group: g.name, count: items.length, collapsed: isCollapsed });
      if (!isCollapsed) items.forEach(t => rows.push({ kind: "task", task: t }));
    });

    // Safety net: tasks whose group isn't in the groups list
    const knownGroups = new Set(groups.map(g => g.name));
    filteredTasks
      .filter(t => !knownGroups.has(t.group))
      .forEach(t => rows.push({ kind: "task", task: t }));

    return rows;
  }, [filteredTasks, collapsedGroups, groups]);

  const stats = useMemo(() => {
    const total   = tasks.length;
    const overall = Math.round(tasks.reduce((sum, t) => sum + t.pct, 0) / Math.max(1, total));
    return { total, overall };
  }, [tasks]);

  const projectStart = useMemo(() =>
    tasks.length ? tasks.reduce((earliest, t) => S.toD(t.s) < earliest ? S.toD(t.s) : earliest, S.toD(tasks[0].s)) : null,
  [tasks]);

  const projectEnd = useMemo(() =>
    tasks.length ? tasks.reduce((latest, t) => S.toD(t.e) > latest ? S.toD(t.e) : latest, S.toD(tasks[0].e)) : null,
  [tasks]);

  const dayPxLabel = dayPx >= 16 ? "Day" : dayPx >= 5 ? "Week" : dayPx >= 2 ? "Month" : "Quarter";

  const selectedTask = tasks.find(t => t.id === selectedId) || null;

  // v4: show baseline tooltip only during the 'baseline_tip' onboarding phase and no baselines yet
  const showBaselineTip = onboardingPhase === 'baseline_tip' && baselines.length === 0;

  // ── Scroll sync (list ↔ Gantt) ────────────────────────────────────────────

  const onListScroll = useCallback(e => {
    if (syncingScroll.current) return;
    syncingScroll.current = true;
    if (ganttScrollRef.current) ganttScrollRef.current.scrollTop = e.target.scrollTop;
    syncingScroll.current = false;
  }, []);

  const onGanttScroll = useCallback(e => {
    if (syncingScroll.current) return;
    syncingScroll.current = true;
    if (listRef.current) listRef.current.scrollTop = e.target.scrollTop;
    syncingScroll.current = false;
  }, []);

  // ── Handlers ──────────────────────────────────────────────────────────────

  const startProject = useCallback((name, withExample) => {
    const today    = new Date();
    const newTasks = withExample ? S.EXAMPLE_TASKS.map((t, i) => S.enrichTask(t, i, today)) : [];
    setProjectName(name);
    setTasks(newTasks);
    setGroups(S.DEFAULT_GROUPS);
    setParties(S.DEFAULT_PARTIES);
    setNotes([]);
    setCollapsedGroups([]);
    setSelectedId(null);
    setShowWizard(false);
  }, []);

  const updateTask = useCallback((id, patch) => {
    setTasks(ts => ts.map(task => {
      if (task.id !== id) return task;
      const next = { ...task, ...patch };
      if ("status" in patch) next.manualStatus = true;
      if ("pct"    in patch) next.manualPct    = true;
      // Auto-complete when actualFinish is set
      if ("actualFinish" in patch && patch.actualFinish) {
        next.pct          = 100;
        next.status       = "complete";
        next.manualStatus = true;
        next.manualPct    = true;
        // Trigger completionPulse flash on the task row
        setCompletionFlashId(id);
        setTimeout(() => setCompletionFlashId(cf => cf === id ? null : cf), 600);
      }
      // Clear completion when actualFinish is cleared
      if ("actualFinish" in patch && !patch.actualFinish && task.actualFinish) {
        next.manualStatus = false;
        next.manualPct    = false;
        const auto = S.computeAutoProgress(next.s, next.e, todayDate);
        next.status = auto.status;
        next.pct    = auto.pct;
      }
      // Recalculate auto-progress when dates change and neither field is manually overridden.
      if (("s" in patch || "e" in patch) && !next.manualStatus && !next.manualPct) {
        const auto = S.computeAutoProgress(next.s, next.e, todayDate);
        next.status = auto.status;
        next.pct    = auto.pct;
      }
      return next;
    }));
  }, [todayDate]);

  const pushUndo = useCallback((label, restore) => {
    setUndoStack(s => [{ label, restore }, ...s].slice(0, 20));
  }, []);

  const dismissToast = useCallback(() => setUndoToast(null), []);

  const deleteTask = useCallback(id => {
    setTasks(ts => {
      const task = ts.find(t => t.id === id);
      if (!task) return ts;
      const taskNotes = [];
      setNotes(ns => {
        const kept = ns.filter(n => n.taskId !== id);
        taskNotes.push(...ns.filter(n => n.taskId === id));
        return kept;
      });
      pushUndo(`Deleted "${task.name}"`, () => {
        setTasks(prev => [...prev, task]);
        setNotes(prev => [...prev, ...taskNotes]);
      });
      setUndoToast({ message: 'Deleted', highlight: task.name, onUndo: null });
      return ts.filter(t => t.id !== id);
    });
    setSelectedId(null);
  }, [pushUndo]);

  const addTask = useCallback(() => {
    const today  = S.fmtDate(new Date());
    const end    = S.fmtDate(S.addDays(new Date(), 14));
    const group  = groupFilter || groups[0]?.name || "Planning";
    const newTask = {
      id:           "t" + Date.now(),
      name:         "New task",
      group,
      s:            today,
      e:            end,
      pct:          0,
      status:       "not_started",
      party:        null,
      notes:        "",
      milestone:    false,
      manualStatus: false,
      manualPct:    false,
      deps:         [],
    };
    setTasks(ts => [...ts, newTask]);
    setSelectedId(newTask.id);
  }, [groupFilter, groups]);

  const addNote = useCallback((taskId, text) => {
    setNotes(ns => [...ns, { id: "n" + Date.now(), taskId, text, when: S.nowLabel() }]);
  }, []);

  const toggleGroup = useCallback(groupName => {
    setCollapsedGroups(c =>
      c.includes(groupName) ? c.filter(x => x !== groupName) : [...c, groupName]
    );
  }, []);

  const updateGroups = useCallback(newGroups => {
    // Build rename map: old name → new name, for syncing task.group
    const oldNameById = {};
    groups.forEach(g => { oldNameById[g.id] = g.name; });

    const renames = {};
    newGroups.forEach(g => {
      if (oldNameById[g.id] && oldNameById[g.id] !== g.name) {
        renames[oldNameById[g.id]] = g.name;
      }
    });

    const newNameSet    = new Set(newGroups.map(g => g.name));
    const deletedNames  = new Set(
      groups.map(g => g.name).filter(n => !newNameSet.has(renames[n] || n))
    );
    const fallbackGroup = newGroups[0]?.name;

    setTasks(ts => ts.map(task => {
      let group = renames[task.group] || task.group;
      if (deletedNames.has(group)) group = fallbackGroup || group;
      return { ...task, group };
    }));

    setCollapsedGroups(c =>
      c.map(n => renames[n] || n).filter(n => !deletedNames.has(n))
    );

    if (groupFilter) {
      if (deletedNames.has(groupFilter))  setGroupFilter(null);
      else if (renames[groupFilter])      setGroupFilter(renames[groupFilter]);
    }

    setGroups(newGroups);
  }, [groups, groupFilter]);

  const handleCSVImport = useCallback((importedTasks, mode) => {
    if (mode === "replace") {
      const prevTasks = tasks;
      pushUndo(`CSV replace (${importedTasks.length} tasks)`, () => setTasks(prevTasks));
      setUndoToast({ message: 'Imported', highlight: `${importedTasks.length} tasks — replaced all`, onUndo: null });
      setTasks(importedTasks);
    } else {
      setTasks(ts => {
        const next = [...ts, ...importedTasks];
        pushUndo(`CSV append (${importedTasks.length} tasks)`, () => setTasks(ts));
        return next;
      });
      setUndoToast({ message: 'Appended', highlight: `${importedTasks.length} tasks`, onUndo: null });
    }
    setCsvDialog(null);
    setSelectedId(null);
  }, [tasks, pushUndo]);

  const exportCSV = useCallback(() => {
    if (!tasks.length) { alert("No tasks to export."); return; }
    const csv  = S.generateCSV(tasks, groups, parties);
    const slug = projectName.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
    S.downloadFile(csv, slug + "-schedule.csv", "text/csv;charset=utf-8;");
  }, [tasks, groups, parties, projectName]);

  const resetProject = useCallback(() => {
    if (!confirm("Start a new project? All current data will be cleared.")) return;
    localStorage.removeItem(STORAGE_KEY);
    setTasks([]);
    setNotes([]);
    setCollapsedGroups([]);
    setSelectedId(null);
    setGroups(S.DEFAULT_GROUPS);
    setParties(S.DEFAULT_PARTIES);
    setShowWizard(true);
  }, []);

  const setZoom = useCallback(level => {
    setZoomKey(level);
    setDayPx(window.ZOOM_LEVELS[level].dayPx);
  }, []);

  // ── v3 new handlers ───────────────────────────────────────────────────────

  const lockBaseline = useCallback(() => {
    const num  = baselines.length + 1;
    const name = `Baseline v${num}`;
    const date = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    const snap = { id: "bl-" + Date.now(), name, date, tasks: tasks.map(t => ({ ...t })) };
    setBaselines(bs => [...bs, snap]);
    setActiveBaseline(snap.id);
    setUndoToast({ message: 'Locked baseline', highlight: name, onUndo: null });
  }, [tasks, baselines]);

  const deleteBaseline = useCallback(id => {
    setBaselines(bs => bs.filter(b => b.id !== id));
    setActiveBaseline(cur => cur === id ? null : cur);
  }, []);

  const handleSaveWorkweek = useCallback((ww, hols) => {
    setWorkweek(ww);
    setHolidays(hols);
    setShowWorkweek(false);
  }, []);

  const handleSaveLinkBuilder = useCallback((selectedDeps, depType, lag) => {
    if (!selectedId) return;
    updateTask(selectedId, { deps: selectedDeps });
    setShowLinkBuilder(false);
  }, [selectedId, updateTask]);

  const triggerPrint = useCallback(() => {
    // v4: open print preview modal first so user can validate layout
    setShowPrintPreview(true);
  }, []);

  // Called from inside the print preview modal's "Print / Save PDF" button
  const executePrint = useCallback(() => {
    setShowPrintPreview(false);
    setPrintLoading(true);
    setTimeout(() => {
      setPrintLoading(false);
      window.print();
    }, 800);
  }, []);

  const zoomIn    = useCallback(() => setDayPx(p => Math.min(80, p * 1.25)), []);
  const zoomOut   = useCallback(() => setDayPx(p => Math.max(1,  p * 0.8)),  []);
  const zoomReset = useCallback(() => setDayPx(window.ZOOM_LEVELS[zoom].dayPx), [zoom]);

  const openCSVImport = useCallback(() => {
    window.triggerCSVImport(raw => setCsvDialog({ rawText: raw }));
  }, []);

  // ── Render ────────────────────────────────────────────────────────────────

  const activeBaselineData = baselines.find(b => b.id === activeBaseline) || null;

  return (
    <div className="app">
      {showWizard && <SetupWizard onStart={startProject}/>}

      <TopBar
        projectName={projectName}
        onRenameProject={setProjectName}
        stats={stats}
        zoom={zoom}
        setZoom={setZoom}
        onAddTask={addTask}
        onImportCSV={openCSVImport}
        onExportCSV={exportCSV}
        onManagePhases={() => setShowGroups(true)}
        onManageParties={() => setShowParties(true)}
        onReset={resetProject}
        projectStart={projectStart}
        projectEnd={projectEnd}
        showCriticalPath={showCriticalPath}
        onToggleCriticalPath={() => setShowCriticalPath(v => !v)}
        cpAvailable={hasDeps}
        baselines={baselines}
        activeBaseline={activeBaseline}
        onToggleBaseline={setActiveBaseline}
        onLockBaseline={lockBaseline}
        onDeleteBaseline={deleteBaseline}
        onManageWorkweek={() => setShowWorkweek(true)}
        onPrint={triggerPrint}
        showBaselineTip={showBaselineTip}
      />

      <FilterBar
        search={search}           setSearch={setSearch}
        groupFilter={groupFilter} setGroupFilter={setGroupFilter}
        statusFilter={statusFilter} setStatusFilter={setStatusFilter}
        partyFilter={partyFilter} setPartyFilter={setPartyFilter}
        tasks={tasks} parties={parties} groups={groups}
        visibleCount={filteredTasks.length}
      />

      <div className="main">
        {tasks.length === 0 ? (
          <EmptyState onAddTask={addTask} onImport={openCSVImport}/>
        ) : (
          <>
            <TaskList
              rows={visibleRows}
              rowHeight={ROW_HEIGHT}
              onSelect={setSelectedId}
              selectedId={selectedId}
              onToggleGroup={toggleGroup}
              listRef={listRef}
              onScroll={onListScroll}
              parties={parties}
              notes={notes}
              groupColorMap={groupColorMap}
              floatMap={floatMap}
              kbFocusId={kbFocusId}
              completionFlashId={completionFlashId}
            />
            <div className={[
              "gantt-area",
              mobileTab === "gantt" ? "mobile-active" : "",
              ganttPulse ? "onboarding-pulse" : "",
            ].filter(Boolean).join(' ')}>
              <div className="gantt-scroll" ref={ganttScrollRef} onScroll={onGanttScroll}>
                <Gantt
                  visibleRows={visibleRows}
                  dayPx={dayPx}
                  zoom={zoom}
                  timeline={timeline}
                  selectedId={selectedId}
                  onSelect={setSelectedId}
                  onUpdateTask={updateTask}
                  rowHeight={ROW_HEIGHT}
                  todayDate={todayDate}
                  groupColorMap={groupColorMap}
                  allTasks={tasks}
                  criticalPathIds={criticalPathIds}
                  showCriticalPath={showCriticalPath}
                  activeBaseline={activeBaseline}
                  baselines={baselines}
                  ghostStyle={ghostStyle}
                />
              </div>
              {/* Ghost bar style toggle — only visible when a baseline is overlaid */}
              <div className={'ghost-style-toggle' + (activeBaseline ? ' visible' : '')}>
                <span className="gst-label">Ghost</span>
                {[
                  ['stripe',  '///'],
                  ['solid',   '▬'],
                  ['outline', '⬜'],
                ].map(([v, glyph]) => (
                  <button
                    key={v}
                    className={'gst-btn' + (ghostStyle === v ? ' gst-active' : '')}
                    onClick={() => setGhostStyle(v)}
                    title={{ stripe: 'Diagonal stripes (default)', solid: 'Solid fill 20%', outline: 'Dashed outline' }[v]}
                  >
                    {glyph}
                  </button>
                ))}
              </div>
              <div className="gantt-zoom-pill">
                <button className="gzc-btn" onClick={zoomOut}   title="Zoom out">−</button>
                <button className="gzc-reset" onClick={zoomReset}>{dayPxLabel}</button>
                <button className="gzc-btn" onClick={zoomIn}    title="Zoom in">+</button>
              </div>
            </div>
            {selectedTask && (
              <SidePanel
                task={selectedTask}
                parties={parties}
                groups={groups}
                notes={notes}
                onClose={() => setSelectedId(null)}
                onUpdate={updateTask}
                onDelete={deleteTask}
                onAddNote={addNote}
                allTasks={tasks}
                onOpenLinkBuilder={() => setShowLinkBuilder(true)}
              />
            )}
          </>
        )}
      </div>

      {/* Mobile tab switcher */}
      <MobileTabSwitcher activeTab={mobileTab} onSwitch={setMobileTab}/>

      {/* Undo toast */}
      {undoToast && (
        <UndoToast
          message={undoToast.message}
          highlight={undoToast.highlight}
          onUndo={undoToast.onUndo}
          onDismiss={dismissToast}
        />
      )}

      {/* Print loading overlay */}
      {printLoading && (
        <div className="schedule-print-loading">
          <div className="schedule-print-loading__box">
            <div className="print-spinner"/>
            <div className="schedule-print-loading__msg">Preparing print layout…</div>
          </div>
        </div>
      )}

      {/* Print preview modal (v4) — validates layout before calling window.print() */}
      {showPrintPreview && (
        <window.PrintPreviewModal
          tasks={tasks}
          groups={groups}
          groupColorMap={groupColorMap}
          projectName={projectName}
          onClose={() => setShowPrintPreview(false)}
          onPrint={executePrint}
        />
      )}

      {showGroups && (
        <GroupsManager groups={groups} onUpdate={updateGroups} onClose={() => setShowGroups(false)}/>
      )}
      {showParties && (
        <PartiesManager parties={parties} onUpdate={setParties} onClose={() => setShowParties(false)}/>
      )}
      {csvDialog && (
        <CsvImportDialog
          rawText={csvDialog.rawText}
          groups={groups}
          parties={parties}
          onImport={handleCSVImport}
          onCancel={() => setCsvDialog(null)}
        />
      )}
      {showWorkweek && (
        <WorkweekModal
          workweek={workweek}
          holidays={holidays}
          onSave={handleSaveWorkweek}
          onClose={() => setShowWorkweek(false)}
        />
      )}
      {showLinkBuilder && selectedTask && (
        <LinkBuilderModal
          tasks={tasks}
          task={selectedTask}
          groups={groups}
          onClose={() => setShowLinkBuilder(false)}
          onSave={handleSaveLinkBuilder}
        />
      )}
    </div>
  );
}

window.App = App;

</script>

<script type="text/babel">
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
